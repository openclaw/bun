name: bun-types

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/bun-types/**"
      - "test/integration/bun-types/**"
      - "src/cli/init/tsconfig.default.json"
      - "src/**/*.bind.ts"
      - "src/codegen/**"
      - "scripts/build/deps/webkit-artifacts.json"
      - ".github/workflows/bun-types.yml"
  pull_request:
    paths:
      - "packages/bun-types/**"
      - "test/integration/bun-types/**"
      - "src/cli/init/tsconfig.default.json"
      - "src/**/*.bind.ts"
      - "src/codegen/**"
      - "scripts/build/deps/webkit-artifacts.json"
      - ".github/workflows/bun-types.yml"

env:
  BUN_VERSION: "canary"

jobs:
  typecheck:
    name: "TypeScript types"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: |
          bun install
          bun install --cwd test
      - name: Read the fork engine pin
        id: webkit
        run: |
          bun -e 'import manifest from "./scripts/build/deps/webkit-artifacts.json"; console.log(`revision=${manifest.version}`)' >> "$GITHUB_OUTPUT"
      - name: Fetch the pinned fork engine sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/WebKit
          ref: ${{ steps.webkit.outputs.revision }}
          path: vendor/WebKit
          sparse-checkout: |
            Source/JavaScriptCore/aot
          persist-credentials: false
      - name: Check types
        run: bun test test/integration/bun-types/bun-types.test.ts

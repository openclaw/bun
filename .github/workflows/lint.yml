name: Lint

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

env:
  # `bun lint` and `bun fmt` aren't in a release yet. Pin this to 1.5.0 once it's out.
  BUN_VERSION: "canary"

jobs:
  lint-js:
    name: "Lint JavaScript"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          # The action's default bucket can be many commits behind for canary.
          download-url: https://github.com/oven-sh/bun/releases/download
      - name: Setup Dependencies
        run: |
          bun install --frozen-lockfile
      - name: Lint
        run: bun lint --format=github
      - name: Typecheck the build system and the CI scripts
        run: |
          bun x tsc --noEmit -p scripts/build/tsconfig.json
          bun x tsc --noEmit -p scripts/tsconfig.json
      - name: Read the fork engine pin
        id: webkit
        run: |
          bun -e 'import manifest from "./scripts/build/deps/webkit-artifacts.json"; console.log(`revision=${manifest.version}`)' >> "$GITHUB_OUTPUT"
      - name: Fetch the pinned fork engine sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/WebKit
          ref: ${{ steps.webkit.outputs.revision }}
          path: vendor/WebKit
          sparse-checkout: |
            Source/JavaScriptCore
            Tools/Scripts/aot
          persist-credentials: false
      - name: Check that the engine's generator writes what the build declares
        env:
          AOT_SCHEMA: ${{ github.workspace }}/vendor/WebKit/Source/JavaScriptCore/aot/ir/AOTSchema.def
        run: bun test ./test/internal/aot-schema-generator.test.ts
      - name: Typecheck the built-in modules
        # The code generators write the types src/js/builtins.d.ts references (build/types) and the enums the dev
        # server's sources import (src/runtime/bake/generated.ts). A module with a second text in src/js/ahead-of-time is
        # checked as the compiler reads it.
        run: |
          bun run build:types
          bun src/codegen/check-types-of-modules.ts
      - name: Typecheck the rest of src
        # The code generators, the class definitions and the other build-time TypeScript, then the dev server.
        run: |
          bun x tsc --noEmit -p src/tsconfig.json
          bun x tsc --noEmit -p src/runtime/bake/tsconfig.json
      - name: Check that every name of the compiler's schema has a use
        # The uses are in the engine's C++ and in Bun's Rust. The build looks for them only where it compiles the engine,
        # and CI links a prebuilt one.
        run: |
          BUN_WEBKIT_PATH="$GITHUB_WORKSPACE/vendor/WebKit" bun test test/internal/build-aot-codegen-declared-outputs.test.ts -t "finds a use for every name of the schema"
      - name: Run the tests that read the engine's sources
        # The machines that run test/aot have no sources of the engine, so these files skip themselves there.
        # The step ends where grep finds no file: `bun test` without a file runs every test.
        env:
          AOT_REQUIRE_ENGINE_SOURCES: "1"
        run: |
          files=$(grep -l "harness/engine-text" test/aot/*.test.ts)
          BUN_WEBKIT_PATH="$GITHUB_WORKSPACE/vendor/WebKit" bun test $files

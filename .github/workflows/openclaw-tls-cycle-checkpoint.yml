name: OpenClaw TLS cycle GC checkpoint experiment

on:
  pull_request:
    paths:
      - .github/workflows/openclaw-tls-cycle-checkpoint.yml
      - .github/openclaw/tls-cycle-checkpoint.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: openclaw-tls-cycle-checkpoint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controls
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/openclaw
            .github/workflows
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: 510fef558b464c58de1209298f638fa476d03eef
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.12.1"
      - name: Download the exact consumed signed Darwin artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/tls-darwin-input"
          mkdir "$input"
          gh api repos/openclaw/bun/actions/runs/41238111110 > "$input/run.json"
          gh api repos/openclaw/bun/actions/artifacts/13057470428 > "$input/metadata.json"
          curl --location --fail --silent --show-error --proto '=https' --proto-redir '=https' \
            --max-time 300 --max-filesize 232201333 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/openclaw/bun/actions/artifacts/13057470428/zip \
            --output "$input/artifact.zip"
      - name: Compare unchanged assertions at two GC checkpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir tls-cycle-checkpoint
          cp controls/.github/workflows/openclaw-tls-cycle-checkpoint.yml tls-cycle-checkpoint/workflow.yml
          cp controls/.github/openclaw/tls-cycle-checkpoint.py tls-cycle-checkpoint/controller.py
          cp controls/.github/openclaw/tls-darwin-capability.py tls-cycle-checkpoint/archive.py
          python3 controls/.github/openclaw/tls-cycle-checkpoint.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tls-cycle-checkpoint
          path: tls-cycle-checkpoint/
          if-no-files-found: error
          retention-days: 7

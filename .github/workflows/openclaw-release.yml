name: OpenClaw release

# Pipeline, tag scheme, manifest, signing and the infrastructure choices behind
# them: .github/OPENCLAW_RELEASE.md

on:
  push:
    tags:
      - "openclaw-v*"
  pull_request:
    paths:
      - .github/workflows/openclaw-release.yml
      - scripts/openclaw-release/**
  workflow_dispatch:
    inputs:
      diagnostic_hang:
        description: "Capture original-release parked-worker native state (do not merge)"
        type: boolean
        default: false
      diagnostic_comparison:
        description: "Reuse S8/S7 binaries for parked-worker GC diagnostics (do not merge)"
        type: boolean
        default: false
      diagnostic_release_controls:
        description: "Compare the original signed S8/S7 release-run binaries (do not merge)"
        type: boolean
        default: false
      tag:
        description: "Release tag (openclaw-v…) to build; empty builds the dispatched ref as a dry run"
        type: string
        default: ""
      publish:
        description: "Publish the GitHub release (needs a tag of a commit on main)"
        type: boolean
        default: false
      targets:
        description: "Comma-separated targets; empty = enabled release targets (all six in dry runs). Also: linux-x64-musl, linux-arm64-musl"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: openclaw-release-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

jobs:
  plan:
    if: inputs.diagnostic_comparison != true && inputs.diagnostic_release_controls != true && inputs.diagnostic_hang != true
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      tag: ${{ steps.plan.outputs.tag }}
      webkit: ${{ steps.plan.outputs.webkit }}
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
      darwin: ${{ steps.plan.outputs.darwin }}
      windows: ${{ steps.plan.outputs.windows }}
      windows-signed: ${{ steps.plan.outputs.windows-signed }}
      windows-matrix: ${{ steps.plan.outputs.windows-matrix }}
      mtime: ${{ steps.plan.outputs.mtime }}
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.event.pull_request.head.sha || github.sha }}
          # History for the ancestry check against main; blobs are fetched on demand.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Setup Bun
        uses: ./pipeline/.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
      - name: Test pipeline
        if: ${{ !startsWith(github.head_ref || github.ref_name, 'claude/diag-parked-worker-gc-') }}
        working-directory: pipeline
        run: bun test test/internal/source-lints/openclaw-release.test.ts
      - name: Plan
        id: plan
        env:
          TARGETS: ${{ startsWith(github.head_ref || github.ref_name, 'claude/diag-parked-worker-gc-') && 'windows-x64,windows-arm64' || inputs.targets }}
          WINDOWS_SIGNED: ${{ vars.OPENCLAW_RELEASE_WINDOWS_SIGNED }}
        run: |
          args=(--source source --main origin/main)
          [ -n "$RELEASE_TAG" ] && args+=(--tag "$RELEASE_TAG")
          [ "$PUBLISH" = true ] && args+=(--publish)
          [ "$WINDOWS_SIGNED" = true ] && args+=(--windows-signed)
          [ -n "$TARGETS" ] && args+=(--targets "$TARGETS")
          bun pipeline/scripts/openclaw-release/release.ts plan "${args[@]}"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    # Every target is cross-compiled on upstream's build image (debian 13 arm64); see OPENCLAW_RELEASE.md for runner choices.
    runs-on: ${{ vars.OPENCLAW_RELEASE_BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/julia* /opt/microsoft
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Setup Bun
        uses: ./pipeline/.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
      - name: Generate provisioning script
        id: provision
        env:
          TARGET: ${{ matrix.target }}
        run: echo "script=$(bun pipeline/scripts/openclaw-release/release.ts provision --source source --target "$TARGET" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Provision
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
          SCRIPT: ${{ steps.provision.outputs.script }}
        run: |
          # The toolchain is the upstream build image's, installed into a container of its distro. The bootstrap
          # downloads from a dozen hosts and cannot be rerun in place, so a failed attempt starts from a fresh container.
          # CI=true without GITHUB_ACTIONS: the build's GitHub integration reads run context the container lacks.
          script="${SCRIPT#"$GITHUB_WORKSPACE"/}"
          for attempt in 1 2 3 4; do
            docker rm --force builder > /dev/null 2>&1 || true
            docker run --detach --name builder -e CI=true -v "$GITHUB_WORKSPACE:/work" -w /work \
              docker.io/library/debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c \
              sleep infinity > /dev/null
            if docker exec -e COMMIT -e SCRIPT="$script" builder sh -euc \
              'sh "$SCRIPT" "$COMMIT" openclaw-release && apt-get install --yes --no-install-recommends zip > /dev/null'; then
              exit 0
            fi
            echo "::warning::Provisioning attempt $attempt failed"
            [ "$attempt" = 4 ] && exit 1
            # Hosts like apt.llvm.org fail for minutes at a time, not seconds.
            sleep $((attempt * 120))
          done
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker exec -e TARGET builder bash -euo pipefail -c '
            . /etc/profile.d/bun-ci.sh
            git config --global --add safe.directory "*"
            bun pipeline/scripts/openclaw-release/release.ts build --source source --target "$TARGET" --out dist
          '
          docker rm --force builder > /dev/null
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -l dist
          df -h /
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ startsWith(matrix.target, 'windows-') && format('test-only-input-{0}', matrix.target) || format('build-{0}', matrix.target) }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  sign-macos:
    name: Sign macOS
    needs: [plan, build]
    if: needs.plan.outputs.darwin == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    # A publish runs in this environment, which can hold the signing secrets and require an approval.
    environment: ${{ needs.plan.outputs.publish == 'true' && 'openclaw-release' || '' }}
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ needs.plan.outputs.commit }}
          sparse-checkout: /entitlements.plist
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-darwin-*
          path: dist
          merge-multiple: true
      - name: Sign and notarize
        env:
          # The OpenClaw release fleet's names (openclaw/release-workflows). Pull requests never see them.
          P12_BASE64: ${{ github.event_name != 'pull_request' && secrets.MACOS_SIGNING_P12 || '' }}
          P12_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MACOS_SIGNING_P12_PASSWORD || '' }}
          NOTARY_KEY_P8: ${{ github.event_name != 'pull_request' && secrets.ASC_PRIVATE_KEY_P8 || '' }}
          NOTARYTOOL_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.ASC_KEY_ID || '' }}
          NOTARYTOOL_ISSUER: ${{ github.event_name != 'pull_request' && secrets.ASC_ISSUER_ID || '' }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          REQUIRE_SIGNING: ${{ vars.OPENCLAW_RELEASE_REQUIRE_SIGNING }}
        run: |
          targets=()
          for zip in dist/bun-darwin-*.zip; do
            case "$zip" in
              */bun-darwin-aarch64.zip) targets+=(darwin-arm64) ;;
              */bun-darwin-x64.zip) targets+=(darwin-x64) ;;
            esac
          done
          if [ -z "$P12_BASE64" ]; then
            if [ "$PUBLISH" = true ] && [ "$REQUIRE_SIGNING" = true ]; then
              echo "::error::OPENCLAW_RELEASE_REQUIRE_SIGNING is set but no MACOS_SIGNING_P12 secret is available"
              exit 1
            fi
            echo "::notice::No Developer ID configured: darwin executables keep the linker's ad-hoc signature."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          keychains=("$keychain")
          while read -r existing; do keychains+=("$(echo "$existing" | tr -d '"')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          export NOTARYTOOL_KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$NOTARYTOOL_KEY"
          SIGN_KEYCHAIN="$keychain" pipeline/scripts/openclaw-release/sign-macos.sh --dist dist --entitlements source/entitlements.plist "${targets[@]}"
          rm -f "$NOTARYTOOL_KEY"
          security delete-keychain "$keychain"
      - name: Upload darwin-arm64
        if: hashFiles('dist/bun-darwin-aarch64.zip') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-darwin-arm64
          path: |
            dist/bun-darwin-aarch64*.zip
            dist/darwin-arm64.*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload darwin-x64
        if: hashFiles('dist/bun-darwin-x64.zip') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-darwin-x64
          path: |
            dist/bun-darwin-x64*.zip
            dist/darwin-x64.*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  sign-windows:
    name: Sign Windows releases
    needs: [plan, build]
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.publish == true) && needs.plan.outputs.windows == 'true' && needs.plan.outputs.publish == 'true'
    # The signing dlib requires x64 even when the executable being signed is ARM64.
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/openclaw-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-only-input-windows-*
          merge-multiple: true
          path: dist
      - name: Azure OIDC login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign both Windows architectures and profile executables
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openclaw
          certificate-profile-name: openclaw
          files-folder: dist
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify Foundation signatures and package final bytes
        shell: pwsh
        env:
          MTIME: ${{ needs.plan.outputs.mtime }}
        run: ./scripts/openclaw-release/package-windows.ps1 -Dist dist -Mtime $env:MTIME -Mode SignedRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-windows
          path: |
            dist/*.zip
            dist/*.signing.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-test-only:
    name: Package unsigned Windows test artifacts
    needs: [plan, build]
    if: needs.plan.outputs.windows == 'true' && needs.plan.outputs.publish != 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/openclaw-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-only-input-windows-*
          merge-multiple: true
          path: dist
      - name: Package test-only bytes without signing credentials
        shell: pwsh
        env:
          MTIME: ${{ needs.plan.outputs.mtime }}
        run: ./scripts/openclaw-release/package-windows.ps1 -Dist dist -Mtime $env:MTIME -Mode UnsignedTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-only-windows
          path: |
            dist/*.zip
            dist/*.signing.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: [plan, build, sign-macos, sign-windows, windows-test-only]
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'claude/diag-parked-worker-gc-') && !cancelled() && needs.build.result == 'success' && needs.sign-macos.result != 'failure' && (needs.plan.outputs.windows != 'true' || (needs.plan.outputs.publish == 'true' && needs.sign-windows.result == 'success') || (needs.plan.outputs.publish != 'true' && needs.windows-test-only.result == 'success')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Smoke test
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TRIPLET: ${{ matrix.triplet }}
          CONTAINER: ${{ matrix.container }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          WEBKIT: ${{ needs.plan.outputs.webkit }}
        run: |
          # The release's own executable runs the checks, so the runner needs no other Bun.
          unzip -q "dist/$TRIPLET.zip" -d unpacked
          exe="unpacked/$TRIPLET/bun"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          smoke=("$exe" pipeline/scripts/openclaw-release/release.ts smoke --zip "dist/$TRIPLET.zip" --target "$TARGET" --commit "$COMMIT" --webkit "$WEBKIT")
          if [ -n "$CONTAINER" ]; then
            docker run --rm -v "$PWD:/work" -w /work "$CONTAINER" sh -c 'apk add --no-cache libgcc libstdc++ unzip > /dev/null && "$@"' sh "${smoke[@]}"
          else
            "${smoke[@]}"
          fi
          # Upstream links darwin-x64 unsigned; everything else carries a signature that must verify.
          if [ "$RUNNER_OS" = macOS ] && { [ "$TARGET" = darwin-arm64 ] || [ -f "dist/$TARGET.signing.json" ]; }; then
            codesign --verify --strict --verbose=2 "$exe"
            codesign -dv "$exe" 2>&1 | grep -E '^(Authority|TeamIdentifier|CodeDirectory)' || true
          fi

  windows-compatibility:
    name: Compatibility ${{ matrix.target }}
    needs: [plan, build, sign-windows, windows-test-only]
    if: ${{ !cancelled() && needs.plan.outputs.windows == 'true' && ((needs.plan.outputs.publish == 'true' && needs.sign-windows.result == 'success') || (needs.plan.outputs.publish != 'true' && needs.windows-test-only.result == 'success')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.3.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Run shared Windows compatibility selection
        working-directory: source
        shell: pwsh
        env:
          TRIPLET: ${{ matrix.triplet }}
          EXPECTED_ARCH: ${{ matrix.target == 'windows-arm64' && 'arm64' || 'x64' }}
        run: |
          Expand-Archive -LiteralPath "../dist/$env:TRIPLET.zip" -DestinationPath ../runtime
          $exe = (Resolve-Path "../runtime/$env:TRIPLET/bun.exe").Path
          $arch = & $exe -p process.arch
          if ($LASTEXITCODE -ne 0 -or $arch -cne $env:EXPECTED_ARCH) { throw 'Unexpected runtime architecture.' }
          $env:PATH = "$(Split-Path $exe);$env:PATH"
          New-Item -ItemType Directory -Force build/openclaw-ci/traces | Out-Null
          $env:BUN_DIAG_GC_WAKE_DIR = (Resolve-Path build/openclaw-ci/traces).Path
          & $exe --revision
          & $exe -p 'process.versions.webkit'
          git rev-parse HEAD
          node scripts/runner.node.ts --exec-path $exe --vendor=false --retries=0 --results-json build/openclaw-ci/results.json --include js/node/worker_threads/worker_threads.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Worker diagnostic failed.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-${{ matrix.target }}
          path: |
            source/build/openclaw-ci/*.json
            source/build/openclaw-ci/traces/*.log
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Manifest
    needs: [plan, build, sign-macos, smoke, windows-compatibility]
    if: ${{ !cancelled() && needs.smoke.result == 'success' && (needs.plan.outputs.windows != 'true' || needs.windows-compatibility.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Setup Bun
        uses: ./pipeline/.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{build-linux-*,signed-*,test-only-windows}"
          path: dist
          merge-multiple: true
      - name: Write manifest
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          WINDOWS_SIGNED: ${{ needs.plan.outputs.windows-signed }}
        run: |
          revision=""
          if [ -f dist/bun-linux-x64.zip ]; then
            unzip -q dist/bun-linux-x64.zip -d "$RUNNER_TEMP"
            revision="$("$RUNNER_TEMP/bun-linux-x64/bun" --revision)"
          fi
          args=()
          [ "$PUBLISH" = true ] && args+=(--publish)
          [ "$WINDOWS_SIGNED" = true ] && args+=(--windows-signed)
          bun pipeline/scripts/openclaw-release/release.ts manifest --source source --commit HEAD \
            --dist dist --out release --tag "$TAG" --workflow-run "$RUN_URL" ${revision:+--revision "$revision"} "${args[@]}"
          cp dist/*.zip release/
          cat release/manifest.json
          cat release/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish
    needs: [plan, manifest]
    if: ${{ !cancelled() && needs.manifest.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/manifest.json
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ vars.OPENCLAW_RELEASE_PRERELEASE || 'true' }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          # The tag may have moved since the plan job read it; the release must name the commit that was built.
          tagged="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$TAG" "refs/tags/$TAG^{}" | sort -k2 | tail -1 | cut -f1)"
          if [ "$tagged" != "$COMMIT" ]; then
            echo "::error::$TAG points at ${tagged:-nothing}, but $COMMIT was built"
            exit 1
          fi
          cd release
          sha256sum --check SHA256SUMS
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md --latest=false)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" ./*.zip manifest.json SHA256SUMS

  compare:
    if: inputs.diagnostic_comparison == true || inputs.diagnostic_release_controls == true
    permissions:
      contents: read
      actions: read
    name: Compare S8 and S7 on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            triplet: bun-windows-x64
          - arch: arm64
            runner: windows-11-arm
            triplet: bun-windows-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: s8
          ref: ${{ inputs.diagnostic_release_controls && '6aba42d75d4bcee905087fa518cb2df6ff49bb0d' || 'a242c7f085316fb4c6c0a78c2e3a557e65a0c846' }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: s7
          ref: ${{ inputs.diagnostic_release_controls && '807211511f81e0a6639bc9eb41d67120f6b85316' || '4e3f28e9b2fb8abb296afd55a819b925b0a0c730' }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.diagnostic_release_controls && 'signed-windows' || 'test-only-windows' }}
          path: s8-dist
          run-id: ${{ inputs.diagnostic_release_controls && 40153838318 || 40158095734 }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.diagnostic_release_controls && 'signed-windows' || 'test-only-windows' }}
          path: s7-dist
          run-id: ${{ inputs.diagnostic_release_controls && 40123710650 || 40158426381 }}
          github-token: ${{ github.token }}
      - name: Run unchanged full files and interleaved focused trials
        shell: pwsh
        env:
          TRIPLET: ${{ matrix.triplet }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          USE_RELEASE_CONTROLS: ${{ inputs.diagnostic_release_controls && '1' || '0' }}
        run: |
          Expand-Archive -LiteralPath "s8-dist/$env:TRIPLET.zip" -DestinationPath s8-runtime
          Expand-Archive -LiteralPath "s7-dist/$env:TRIPLET.zip" -DestinationPath s7-runtime
          $s8 = (Resolve-Path "s8-runtime/$env:TRIPLET/bun.exe").Path
          $s7 = (Resolve-Path "s7-runtime/$env:TRIPLET/bun.exe").Path
          node pipeline/scripts/openclaw-release/gc-wake-diagnostic.mjs evidence $s8 s8 $s7 s7
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic failures are retained in the artifacts.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gc-wake-comparison-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  diagnostic-hang:
    name: Capture original ARM64 parked-worker state
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_hang == true
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: s8
          ref: 6aba42d75d4bcee905087fa518cb2df6ff49bb0d
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: s7
          ref: 807211511f81e0a6639bc9eb41d67120f6b85316
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-windows
          path: s8-dist
          run-id: 40153838318
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-windows
          path: s7-dist
          run-id: 40123710650
          github-token: ${{ github.token }}
      - name: Install signed native debugging tools
        id: tools
        shell: pwsh
        run: ./pipeline/scripts/openclaw-release/gc-wake-hang-tools.ps1
      - name: Capture unchanged focused test children
        shell: pwsh
        env:
          DUMP_TOOL: ${{ steps.tools.outputs.procdump }}
          DEBUGGER_TOOL: ${{ steps.tools.outputs.cdb }}
        run: |
          foreach ($variant in @('s8', 's7')) {
            Expand-Archive -LiteralPath "$variant-dist/bun-windows-aarch64.zip" -DestinationPath "$variant-runtime"
            Expand-Archive -LiteralPath "$variant-dist/bun-windows-aarch64-profile.zip" -DestinationPath "$variant-runtime"
            foreach ($mode in @('normal', 'profile')) {
              $directory = "$variant-runtime/bun-windows-aarch64"
              $binary = 'bun.exe'
              if ($mode -eq 'profile') { $directory += '-profile'; $binary = 'bun-profile.exe' }
              $exe = (Resolve-Path "$directory/$binary").Path
              node pipeline/scripts/openclaw-release/gc-wake-hang-probe.mjs $exe $variant "hang-evidence/$variant-$mode" $env:DUMP_TOOL $env:DEBUGGER_TOOL (Resolve-Path $directory).Path
              if ($LASTEXITCODE -ne 0) { throw "Probe setup failed for $variant-$mode" }
            }
          }
      - name: Inspect retained dumps with matching profile symbols
        timeout-minutes: 8
        shell: pwsh
        run: |
          $cdb = "${env:ProgramFiles(x86)}/Windows Kits/10/Debuggers/arm64/cdb.exe"
          if (!(Test-Path $cdb)) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2342616' -OutFile hang-tools/winsdksetup.exe
            if ((Get-AuthenticodeSignature hang-tools/winsdksetup.exe).Status -ne 'Valid') { throw 'SDK installer signature is invalid.' }
            $setup = Start-Process hang-tools/winsdksetup.exe -ArgumentList '/quiet /norestart /features OptionId.WindowsDesktopDebuggers' -Wait -PassThru
            if ($setup.ExitCode -notin @(0, 3010)) { throw "Debugger setup failed: $($setup.ExitCode)" }
          }
          if (!(Test-Path $cdb)) { throw 'Native cdb unavailable; raw dumps are retained.' }
          foreach ($variant in @('s8', 's7')) {
            foreach ($mode in @('normal', 'profile')) {
              $symbols = "$variant-runtime/bun-windows-aarch64"
              if ($mode -eq 'profile') { $symbols += '-profile' }
              foreach ($dump in Get-ChildItem "hang-evidence/$variant-$mode" -Filter '*.dmp') {
                & $cdb -z $dump.FullName -y (Resolve-Path $symbols).Path -c '.reload; lm; ~* kP; !runaway; q' *> "$($dump.DirectoryName)/offline-debugger.log"
              }
            }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gc-wake-arm64-hang-state
          path: |
            hang-evidence/
            hang-tools/tools.json
          if-no-files-found: error
          retention-days: 14

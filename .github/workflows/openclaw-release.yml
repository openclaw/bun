name: OpenClaw release

# Temporary diagnostic workflow. This draft branch must never merge.
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Windows ARM64 diagnostic experiment"
        type: choice
        options: [bisect, async-clear]
        default: bisect

permissions:
  contents: read

concurrency:
  group: gc-engine-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: node scripts/openclaw-release/gc-r2-config.mjs "$EXPERIMENT" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.id }}
    needs: matrix
    runs-on: ${{ vars.OPENCLAW_RELEASE_BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/julia* /opt/microsoft
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: ./pipeline/.github/actions/setup-bun
        with:
          bun-version: "1.4.4"
      - name: Select exact engine and verify unchanged case
        working-directory: pipeline
        env:
          ENGINE_REF: ${{ matrix.engineRef }}
          SOURCE_REF: ${{ matrix.source }}
          KIND: ${{ matrix.kind }}
        run: bun scripts/openclaw-release/gc-r2-prepare.mjs ../source "$ENGINE_REF" "$SOURCE_REF" "$KIND"
      - name: Generate provisioning script
        id: provision
        run: echo "script=$(bun pipeline/scripts/openclaw-release/release.ts provision --source source --target windows-arm64 | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Provision
        env:
          COMMIT: ${{ matrix.source }}
          SCRIPT: ${{ steps.provision.outputs.script }}
        run: |
          script="${SCRIPT#"$GITHUB_WORKSPACE"/}"
          for attempt in 1 2 3 4; do
            docker rm --force builder > /dev/null 2>&1 || true
            docker run --detach --name builder -e CI=true -v "$GITHUB_WORKSPACE:/work" -w /work \
              docker.io/library/debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c \
              sleep infinity > /dev/null
            if docker exec -e COMMIT -e SCRIPT="$script" builder sh -euc \
              'sh "$SCRIPT" "$COMMIT" openclaw-release && apt-get install --yes --no-install-recommends zip > /dev/null'; then
              exit 0
            fi
            echo "::warning::Provisioning attempt $attempt failed"
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 120))
          done
      - name: Build
        run: |
          docker exec builder bash -euo pipefail -c '
            . /etc/profile.d/bun-ci.sh
            git config --global --add safe.directory "*"
            bun pipeline/scripts/openclaw-release/release.ts build --source source --target windows-arm64 --out dist
          '
          docker rm --force builder > /dev/null
          sudo chown -R "$(id -u):$(id -g)" dist
          cp source/build/gc-r2-metadata.json dist/gc-r2-metadata.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gc-r2-build-${{ matrix.id }}
          path: |
            dist/bun-windows-aarch64/bun.exe
            dist/gc-r2-metadata.json
          if-no-files-found: error
          retention-days: 14

  native:
    name: Compare native Windows ARM64
    needs: build
    permissions:
      contents: read
      actions: read
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: s8
          ref: 6aba42d75d4bcee905087fa518cb2df6ff49bb0d
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: s7
          ref: 807211511f81e0a6639bc9eb41d67120f6b85316
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gc-r2-build-*
          path: runtime
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-windows
          path: s8-dist
          run-id: 40153838318
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-windows
          path: s7-dist
          run-id: 40123710650
          github-token: ${{ github.token }}
      - name: Run unchanged original case with interleaved controls
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        shell: pwsh
        run: |
          Expand-Archive s8-dist/bun-windows-aarch64.zip s8-runtime
          Expand-Archive s7-dist/bun-windows-aarch64.zip s7-runtime
          node pipeline/scripts/openclaw-release/gc-r2-probe.mjs $env:EXPERIMENT evidence
          if ($LASTEXITCODE -ne 0) { throw 'Invalid diagnostic or controls did not confirm the regression.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gc-r2-native-${{ inputs.experiment }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

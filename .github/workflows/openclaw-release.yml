name: OpenClaw Windows consumer qualification
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful fork release dry-run ID
        type: string
        required: true
      bun_commit:
        description: Exact Bun source commit
        type: string
        required: true
      consumer_commit:
        description: Exact reviewed OpenClaw consumer commit
        type: string
        required: true
      manifest_sha256:
        description: SHA256 of the dry-run manifest
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            triple: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            triple: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      BUN_COMMIT: ${{ inputs.bun_commit }}
      CONSUMER_COMMIT: ${{ inputs.consumer_commit }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: pipeline
          persist-credentials: false
          sparse-checkout: scripts/consumer-replay
      - name: Verify source run and native host
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          if ($env:BUN_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $env:CONSUMER_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $env:MANIFEST_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid exact-source inputs' }
          $run = gh api "repos/openclaw/bun/actions/runs/$env:SOURCE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $env:BUN_COMMIT -or $run.conclusion -cne 'success' -or $run.path -cne '.github/workflows/openclaw-release.yml') { throw 'Source run identity or qualification mismatch' }
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($actual -cne $env:EXPECTED_ARCH) { throw 'Wrong native Windows architecture' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.consumer_commit }}
          path: consumer
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.3.0'
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Stage actual unsigned artifact and add isolated materializer probe
        run: |
          node pipeline/scripts/consumer-replay/prepare.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed' }
          "RUNTIME_SOURCE=$((Resolve-Path 'consumer/apps/linux/src-tauri/target/desktop-runtime').Path)" >> $env:GITHUB_ENV
          "RUNTIME_STATE=$env:RUNNER_TEMP/real-fork-materializer" >> $env:GITHUB_ENV
      - name: Install and verify native Rust
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          rustup toolchain install "1.97.1-$env:TRIPLE" --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          $version = rustc "+1.97.1-$env:TRIPLE" -vV | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "host: $env:TRIPLE") { throw 'Rust host must be native' }
          $version | Set-Content proof/rust-host.txt
      - name: Run actual materializer and unchanged Windows tests
        working-directory: consumer/apps/linux/src-tauri
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          foreach ($filter in @('real_fork_qualification', 'bundled_runtime::tests', 'windows')) {
            cargo "+1.97.1-$env:TRIPLE" test --locked --bin openclaw-desktop $filter -- --nocapture 2>&1 | Tee-Object "../../../../proof/$($filter.Replace(':','-')).log"
            if ($LASTEXITCODE -ne 0) { throw "Native consumer test failed: $filter" }
          }
      - name: Verify actual build script rejects unsigned release profile
        run: ./pipeline/scripts/consumer-replay/release-guard.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consumer-${{ matrix.arch }}
          path: proof/
          if-no-files-found: error
          retention-days: 14

name: OpenClaw module PR Windows qualification

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Exact PR runtime source SHA"
        required: true
        type: string
      pr_number:
        description: "Module regression selection, in addition to every Windows compatibility test"
        required: true
        type: choice
        options: ["116", "119", "120", "126", "127"]
      targets:
        description: "Native Windows architectures to qualify"
        required: true
        type: choice
        default: windows-x64
        options: ["windows-x64", "windows-x64,windows-arm64"]

permissions:
  contents: read

concurrency:
  group: module-pr-windows-${{ inputs.source_commit }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ""
  PUBLISH: "false"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      tag: ${{ steps.plan.outputs.tag }}
      webkit: ${{ steps.plan.outputs.webkit }}
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
      darwin: ${{ steps.plan.outputs.darwin }}
      windows: ${{ steps.plan.outputs.windows }}
      windows-matrix: ${{ steps.plan.outputs.windows-matrix }}
      mtime: ${{ steps.plan.outputs.mtime }}
    steps:
      - name: Validate exact source inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGETS: ${{ inputs.targets }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          case "$PR_NUMBER" in 116|119|120|126|127) ;; *) exit 1 ;; esac
          case "$TARGETS" in windows-x64|windows-x64,windows-arm64) ;; *) exit 1 ;; esac
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ inputs.source_commit }}
          # History for the ancestry check against main; blobs are fetched on demand.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Setup Bun
        uses: ./pipeline/.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
      - name: Test pipeline
        working-directory: pipeline
        run: bun test test/internal/source-lints/openclaw-release.test.ts
      - name: Plan
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          args=(--source source --main origin/main)
          [ -n "$RELEASE_TAG" ] && args+=(--tag "$RELEASE_TAG")
          [ "$PUBLISH" = true ] && args+=(--publish)
          [ -n "$TARGETS" ] && args+=(--targets "$TARGETS")
          bun pipeline/scripts/openclaw-release/release.ts plan "${args[@]}"

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    # Every target is cross-compiled on upstream's build image (debian 13 arm64); see OPENCLAW_RELEASE.md for runner choices.
    runs-on: ${{ vars.OPENCLAW_RELEASE_BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/julia* /opt/microsoft
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Setup Bun
        uses: ./pipeline/.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
      - name: Generate provisioning script
        id: provision
        env:
          TARGET: ${{ matrix.target }}
        run: echo "script=$(bun pipeline/scripts/openclaw-release/release.ts provision --source source --target "$TARGET" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Provision
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
          SCRIPT: ${{ steps.provision.outputs.script }}
        run: |
          # The toolchain is the upstream build image's, installed into a container of its distro. The bootstrap
          # downloads from a dozen hosts and cannot be rerun in place, so a failed attempt starts from a fresh container.
          # CI=true without GITHUB_ACTIONS: the build's GitHub integration reads run context the container lacks.
          script="${SCRIPT#"$GITHUB_WORKSPACE"/}"
          for attempt in 1 2 3 4; do
            docker rm --force builder > /dev/null 2>&1 || true
            docker run --detach --name builder -e CI=true -v "$GITHUB_WORKSPACE:/work" -w /work \
              docker.io/library/debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c \
              sleep infinity > /dev/null
            if docker exec -e COMMIT -e SCRIPT="$script" builder sh -euc \
              'sh "$SCRIPT" "$COMMIT" openclaw-release && apt-get install --yes --no-install-recommends zip > /dev/null'; then
              exit 0
            fi
            echo "::warning::Provisioning attempt $attempt failed"
            [ "$attempt" = 4 ] && exit 1
            # Hosts like apt.llvm.org fail for minutes at a time, not seconds.
            sleep $((attempt * 120))
          done
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker exec -e TARGET builder bash -euo pipefail -c '
            . /etc/profile.d/bun-ci.sh
            git config --global --add safe.directory "*"
            bun pipeline/scripts/openclaw-release/release.ts build --source source --target "$TARGET" --out dist
          '
          docker rm --force builder > /dev/null
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -l dist
          df -h /
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ startsWith(matrix.target, 'windows-') && format('test-only-input-{0}', matrix.target) || format('build-{0}', matrix.target) }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-test-only:
    name: Package unsigned Windows test artifacts
    needs: [plan, build]
    if: needs.plan.outputs.windows == 'true' && needs.plan.outputs.publish != 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/openclaw-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-only-input-windows-*
          merge-multiple: true
          path: dist
      - name: Package test-only bytes without signing credentials
        shell: pwsh
        env:
          MTIME: ${{ needs.plan.outputs.mtime }}
        run: ./scripts/openclaw-release/package-windows.ps1 -Dist dist -Mtime $env:MTIME -Mode UnsignedTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-only-windows
          path: |
            dist/*.zip
            dist/*.signing.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: [plan, build, windows-test-only]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows-test-only.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Smoke test
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TRIPLET: ${{ matrix.triplet }}
          CONTAINER: ${{ matrix.container }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          WEBKIT: ${{ needs.plan.outputs.webkit }}
        run: |
          # The release's own executable runs the checks, so the runner needs no other Bun.
          unzip -q "dist/$TRIPLET.zip" -d unpacked
          exe="unpacked/$TRIPLET/bun"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          smoke=("$exe" pipeline/scripts/openclaw-release/release.ts smoke --zip "dist/$TRIPLET.zip" --target "$TARGET" --commit "$COMMIT" --webkit "$WEBKIT")
          if [ -n "$CONTAINER" ]; then
            docker run --rm -v "$PWD:/work" -w /work "$CONTAINER" sh -c 'apk add --no-cache libgcc libstdc++ unzip > /dev/null && "$@"' sh "${smoke[@]}"
          else
            "${smoke[@]}"
          fi
          # Upstream links darwin-x64 unsigned; everything else carries a signature that must verify.
          if [ "$RUNNER_OS" = macOS ] && { [ "$TARGET" = darwin-arm64 ] || [ -f "dist/$TARGET.signing.json" ]; }; then
            codesign --verify --strict --verbose=2 "$exe"
            codesign -dv "$exe" 2>&1 | grep -E '^(Authority|TeamIdentifier|CodeDirectory)' || true
          fi

  windows-compatibility:
    name: Compatibility ${{ matrix.target }}
    needs: [plan, build, windows-test-only]
    if: ${{ !cancelled() && needs.windows-test-only.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.3.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Run shared Windows compatibility selection
        working-directory: source
        shell: pwsh
        env:
          TRIPLET: ${{ matrix.triplet }}
          EXPECTED_ARCH: ${{ matrix.target == 'windows-arm64' && 'arm64' || 'x64' }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          Expand-Archive -LiteralPath "../dist/$env:TRIPLET.zip" -DestinationPath ../runtime
          $exe = (Resolve-Path "../runtime/$env:TRIPLET/bun.exe").Path
          $revision = & $exe -p Bun.revision
          if ($LASTEXITCODE -ne 0 -or $revision -cne '${{ needs.plan.outputs.commit }}') { throw 'Built runtime revision mismatch.' }
          $arch = & $exe -p process.arch
          if ($LASTEXITCODE -ne 0 -or $arch -cne $env:EXPECTED_ARCH) { throw 'Unexpected runtime architecture.' }
          $env:PATH = "$(Split-Path $exe);$env:PATH"
          & $exe ../pipeline/scripts/openclaw-ci/tests.ts select-windows
          if ($LASTEXITCODE -ne 0) { throw 'Test selection failed.' }
          $extra = switch ($env:PR_NUMBER) {
            '116' { @('test/js/bun/resolve/import-meta-resolve.test.mjs', 'test/js/bun/resolve/import-meta.test.js') }
            '119' { @('test/js/bun/resolve/resolve.test.ts') }
            '120' { @('test/js/bun/resolve/import-query.test.ts') }
            '126' { @('test/js/node/module/require-extensions.test.ts', 'test/napi/napi.test.ts') }
            '127' { @('test/js/node/module/module-resolve-filename-paths.test.js') }
            default { throw 'Unknown module PR selection.' }
          }
          $selected = @(@(Get-Content build/openclaw-ci/selected.json -Raw | ConvertFrom-Json) + $extra | Sort-Object -Unique)
          $hashes = @{}
          foreach ($file in @($selected) + @('test/harness.ts')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing selected source: $file" }
            $hashes[$file] = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          }
          $selected | ConvertTo-Json -AsArray | Set-Content build/openclaw-ci/selected.json
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -cne '${{ needs.plan.outputs.commit }}') { throw 'Runtime source mismatch.' }
          git diff --exit-code HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source changed before qualification.' }
          $binaryHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          @{ runtimeCommit = $source; prNumber = $env:PR_NUMBER; architecture = $arch; binarySha256 = $binaryHash; testFiles = $hashes } | ConvertTo-Json -Depth 8 | Set-Content build/openclaw-ci/source-provenance.json
          & $exe ../pipeline/scripts/openclaw-ci/tests.ts test
          $testExit = $LASTEXITCODE
          $receipt = Get-Content build/openclaw-ci/source-provenance.json -Raw | ConvertFrom-Json
          foreach ($item in $receipt.testFiles.psobject.Properties) {
            if ((Get-FileHash -Algorithm SHA256 $item.Name).Hash.ToLowerInvariant() -cne $item.Value) { throw 'Test source changed during qualification.' }
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant() -cne $receipt.binarySha256) { throw 'Runtime changed during qualification.' }
          git diff --exit-code HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source changed during qualification.' }
          if ($testExit -ne 0) { throw 'Windows compatibility tests failed.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-${{ matrix.target }}
          path: source/build/openclaw-ci/*.json
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Manifest
    needs: [plan, build, smoke, windows-compatibility]
    if: ${{ !cancelled() && needs.smoke.result == 'success' && (needs.plan.outputs.windows != 'true' || needs.windows-compatibility.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Setup Bun
        uses: ./pipeline/.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{build-linux-*,signed-*,test-only-windows}"
          path: dist
          merge-multiple: true
      - name: Write manifest
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          revision=""
          if [ -f dist/bun-linux-x64.zip ]; then
            unzip -q dist/bun-linux-x64.zip -d "$RUNNER_TEMP"
            revision="$("$RUNNER_TEMP/bun-linux-x64/bun" --revision)"
          fi
          args=()
          [ "$PUBLISH" = true ] && args+=(--publish)
          bun pipeline/scripts/openclaw-release/release.ts manifest --source source --commit HEAD \
            --dist dist --out release --tag "$TAG" --workflow-run "$RUN_URL" ${revision:+--revision "$revision"} "${args[@]}"
          cp dist/*.zip release/
          cat release/manifest.json
          cat release/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

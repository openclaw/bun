name: Async GC Linux proof (diagnostic only)

on:
  pull_request:
    paths:
      - .github/workflows/openclaw-async-gc-proof.yml
      - bench/gc-async-ci-proof.py
      - bench/gc-async-stack.mjs

permissions:
  contents: read
  actions: read

jobs:
  linux-proof:
    if: github.repository == 'openclaw/bun'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6b7c19f0db6b3cadfa02391c553919ad6c1409da
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.12.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-linux-x64
          run-id: 40153838318
          github-token: ${{ github.token }}
          path: artifacts/baseline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-linux-x64
          run-id: 40171805209
          github-token: ${{ github.token }}
          path: artifacts/candidate
      - name: Measure pinned portable binaries and run unchanged tests
        run: python3 bench/gc-async-ci-proof.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: async-gc-linux-proof
          path: |
            proof/results/**
            proof/surrounding/**
            proof/*.json
            proof/*.log
          if-no-files-found: error
          retention-days: 14

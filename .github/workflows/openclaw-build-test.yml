name: W179 Darwin RSS runner-environment qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: w179-darwin-rss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  darwin-arm64:
    if: github.repository == 'openclaw/bun'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUN_BUILD_CACHE_DIR: ${{ github.workspace }}/.cache/openclaw-build
      PUPPETEER_SKIP_DOWNLOAD: "1"
      OPENCLAW_CI_PLATFORM: darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0e6a7b354732a887a937f396db1283b8a1bd644e
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: ./pipeline/.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
      - name: Download verified three-engine comparison binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 37352198372
          repository: openclaw/bun
          name: w179-darwin-rss-5c441bf481e2c3e68be13eb0bffa55ff76b73eca
          path: baseline
      - name: Stage artifacts and repeat with fork-runner settings
        run: |
          mkdir evidence
          cp baseline/bun-42ab baseline/bun-641c baseline/bun-f1e1 baseline/metadata.json evidence/
          chmod +x evidence/bun-42ab evidence/bun-641c evidence/bun-f1e1
          python3 pipeline/scripts/w179/scripts/compare.py source evidence --measure-only --runner-env
      - name: Verify proposed guard and retained-object controls
        run: python3 pipeline/scripts/w179/scripts/guard.py source evidence
      - name: Upload measurements and binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w179-darwin-rss-${{ github.sha }}
          path: evidence/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

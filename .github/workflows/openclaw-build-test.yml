name: OpenClaw AOT operation origins (temporary diagnosis)

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [linux-x64]
        default: linux-x64
      webkit_source_sha:
        description: Diagnostic engine commit with temporary operation-origin logging
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: aot-operation-origins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operation-origins:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      BUN_BUILD_CACHE_DIR: ${{ github.workspace }}/.cache/openclaw-build
      PUPPETEER_SKIP_DOWNLOAD: "1"
      WEBKIT_SOURCE_SHA: ${{ inputs.webkit_source_sha }}
      EXPECTED_NATIVE_SHA: 56739277f7834a63cdd2ba8fd496672c5ab8f645
    steps:
      - name: Validate source-pair request
        working-directory: .
        if: inputs.webkit_source_sha != ''
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          test "$PLATFORM" = linux-x64
          [[ "$WEBKIT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 56739277f7834a63cdd2ba8fd496672c5ab8f645
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2596ac5d391d47804c93a42bdbe615804aa62387
          path: source/baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.webkit_source_sha != ''
        with:
          repository: openclaw/WebKit
          ref: ${{ inputs.webkit_source_sha }}
          path: source/.openclaw-webkit
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/
            !/JSTests/
            !/PerformanceTests/
            !/Websites/
            !/ManualTests/
            !/WebDriverTests/
      - name: Record source-pair identity
        if: inputs.webkit_source_sha != ''
        run: |
          test "$(git -C .openclaw-webkit rev-parse HEAD)" = "$WEBKIT_SOURCE_SHA"
          test -z "$(git -C .openclaw-webkit status --porcelain)"
          mkdir -p build/openclaw-ci
          python3 -c 'import json,subprocess; from pathlib import Path; rev=lambda *args: subprocess.check_output(["git",*args],text=True).strip(); Path("build/openclaw-ci/engine-source.json").write_text(json.dumps({"mode":"source", "bun":{"sha":rev("rev-parse","HEAD"),"tree":rev("rev-parse","HEAD^{tree}")},"webkit":{"repository":"openclaw/WebKit","sha":rev("-C",".openclaw-webkit","rev-parse","HEAD"),"tree":rev("-C",".openclaw-webkit","rev-parse","HEAD^{tree}")},"shippingArchiveQualified":False},indent=2)+"\n")'
          echo "BUN_WEBKIT_PATH=$GITHUB_WORKSPACE/source/.openclaw-webkit" >> "$GITHUB_ENV"
          echo 'Temporary operation-origin diagnosis only; this does not qualify shipping or the full suite.' >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.4"
      - name: Read toolchain pins
        id: pins
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          bun -e 'import { locations, pins } from "./scripts/build/ci-images/spec.ts"; console.log(`llvm-directory=${locations.llvm}\nnode=${pins.nodejs.version}\nrust=${pins.rust.channel}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install native build tools
        timeout-minutes: 15
        env:
          LLVM_DIRECTORY: ${{ steps.pins.outputs.llvm-directory }}
          RUST_TOOLCHAIN: ${{ steps.pins.outputs.rust }}
        run: |
          bash scripts/openclaw-ci/install-linux-toolchain.sh
          if test -n "$WEBKIT_SOURCE_SHA"; then
            sudo apt-get install -y --no-install-recommends libicu-dev pkg-config ruby perl
            # Trimming reads ICU data from the executable, so use its static input contract.
            icu_root="$RUNNER_TEMP/source-pair-icu"
            icu_include=$(pkg-config --variable=includedir icu-uc)
            icu_lib=$(pkg-config --variable=libdir icu-uc)
            test -s "$icu_include/unicode/utypes.h"
            for library in libicui18n.a libicuuc.a libicudata.a; do test -s "$icu_lib/$library"; done
            mkdir -p "$icu_root"
            ln -s "$icu_include" "$icu_root/include"
            ln -s "$icu_lib" "$icu_root/lib"
            echo "BUN_ICU_ROOT=$icu_root" >> "$GITHUB_ENV"
            echo "Source-pair ICU: $(pkg-config --modversion icu-uc), static system archives." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify the matched static ICU input
        run: |
          mkdir -p build/openclaw-ci/aot-baseline
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["BUN_ICU_ROOT"])
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={"version":subprocess.check_output(["pkg-config","--modversion","icu-uc"],text=True).strip(),
                   "archives":{name:digest(root/"lib"/name) for name in ("libicui18n.a","libicuuc.a","libicudata.a")},
                   "headers":{p.name:digest(p) for p in sorted((root/"include/unicode").glob("*.h"))}}
          checksum=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          receipt.update(referenceSHA256="119094f556f6bb38db24f3ec0665778f5bddea27d94b4500b2cf87f0e1e0a515",actualSHA256=checksum,referenceMatch=checksum=="119094f556f6bb38db24f3ec0665778f5bddea27d94b4500b2cf87f0e1e0a515")
          Path("build/openclaw-ci/aot-baseline/icu.json").write_text(json.dumps(receipt,indent=2)+"\n")
          assert receipt["referenceMatch"],"static ICU input differs from matched stock control"
          PY
      - name: Restore build caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/openclaw-build
            build/release/rust-target
            ~/.cargo/registry
            ~/.cargo/git
          key: openclaw-native-x64-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'bun.lock', 'test/bun.lock', 'rust-toolchain.toml', 'scripts/build/**', 'scripts/build.ts', '.github/workflows/openclaw-build-test.yml') }}-${{ steps.pins.outputs.tree }}-${{ inputs.webkit_source_sha || 'pinned' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openclaw-native-x64-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'bun.lock', 'test/bun.lock', 'rust-toolchain.toml', 'scripts/build/**', 'scripts/build.ts', '.github/workflows/openclaw-build-test.yml') }}-${{ steps.pins.outputs.tree }}-${{ inputs.webkit_source_sha || 'pinned' }}-
      - name: Install frozen source and baseline type dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_NATIVE_SHA"
          bun install --frozen-lockfile
          (cd baseline && bun install --frozen-lockfile)
      - name: Build the frozen source with the diagnostic engine
        timeout-minutes: 75
        run: |
          unset BUILDKITE_COMMIT GIT_SHA
          export GITHUB_SHA="$EXPECTED_NATIVE_SHA"
          mkdir -p build/openclaw-ci/aot-baseline
          bun -e '
            import { configOf } from "./scripts/build/configure.ts";
            const { cfg } = configOf({ profile: "openclaw-native", overrides: { webkit: "local", webkitVersion: process.env.WEBKIT_SOURCE_SHA } });
            const { buildType, ci, lto, trimmable, webkit, webkitVersion, revision, cc, ld, rustToolchain } = cfg;
            if (buildType !== "Release" || !ci || !lto || !trimmable || webkit !== "local" ||
                revision !== process.env.EXPECTED_NATIVE_SHA || webkitVersion !== process.env.WEBKIT_SOURCE_SHA)
              throw new Error("Unexpected diagnostic build configuration");
            console.log(JSON.stringify({ buildType, ci, lto, trimmable, webkit, webkitVersion, revision, cc, ld, rustToolchain }));
          ' > build/openclaw-ci/aot-baseline/probe-build.json
          bun scripts/build.ts --profile=openclaw-native --webkit=local --webkit-version="$WEBKIT_SOURCE_SHA" --timings -k0
          mkdir -p build/release/bun.trim
          cp build/release/bun-profile.trim/*.txt build/release/bun.trim/
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .openclaw-webkit status --porcelain --untracked-files=no)"
      - name: Trace the two matched compile and runtime flows
        run: bun ../scripts/openclaw-ci/aot-trim-baseline.ts --operation-origins
      - name: Upload diagnostic receipts and operation traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aot-operation-origins-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            source/build/openclaw-ci/*.json
            source/build/openclaw-ci/aot-baseline/*.json
            source/build/openclaw-ci/aot-baseline/*.log
            source/build/release/timings.html
          if-no-files-found: error
          retention-days: 7

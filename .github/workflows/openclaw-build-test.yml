name: OpenClaw external plugin alias qualification

on: workflow_dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: external-plugin-alias-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugin-alias:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
      - name: Verify the admitted native source and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/openclaw/bun/actions/artifacts/13753314663 --jq .workflow_run.id)" = 42793326534
          test "$(gh api repos/openclaw/bun/actions/artifacts/13753314663 --jq .workflow_run.head_sha)" = cd861bb9f53102e92e23ce28684c258055c7e612
          test "$(gh api repos/openclaw/bun/actions/artifacts/13753314663 --jq .digest)" = sha256:993294f9721a2984f1698ca10ecc6dbb84fd3f91eb9fc066f5eff8ea8a366236
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 13753314663
          run-id: 42793326534
          github-token: ${{ github.token }}
          path: build/openclaw-ci/native-input
      - name: Verify and unpack the admitted executable
        run: |
          cd build/openclaw-ci/native-input
          test "$(cat commit.txt)" = cd861bb9f53102e92e23ce28684c258055c7e612
          sha256sum -c SHA256SUMS
          mkdir -p ../../release
          tar -xzf bun-linux-x64.tar.gz -C ../../release bun bun.trim engine-source.json
          cd ../../..
          ./build/release/bun -e 'if (Bun.revision !== "cd861bb9f53102e92e23ce28684c258055c7e612" || process.versions.webkit !== "651eeaca6e2792378928033b1ae7ac66d6f91eab") throw new Error("unadmitted source pair")'
      - name: Install frozen type dependencies
        run: ./build/release/bun install --frozen-lockfile
      - name: Verify the compiled external ESM plugin-alias boundary
        run: node scripts/openclaw-ci/external-plugin-alias-probe.cjs
      - name: Upload plugin-alias proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-plugin-alias-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            build/openclaw-ci/external-plugin-alias/
          if-no-files-found: error
          retention-days: 7

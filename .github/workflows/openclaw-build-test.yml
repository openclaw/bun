name: OpenClaw build and test

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "packages/**"
      - "patches/**"
      - "vendor/**"
      - "cmake/**"
      - "**/CMakeLists.txt"
      - "**/*.cmake"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".github/actions/setup-bun/**"
      - ".github/workflows/openclaw-build-test.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Build Bun, qualify an existing artifact, or benchmark a qualified artifact"
        type: choice
        options: [native, comparison, benchmark]
        default: native
      benchmark_receipt_run_id:
        description: "Completed comparison workflow run ID (benchmark mode only)"
        type: string
        required: false
      benchmark_receipt_artifact_id:
        description: "Completed comparison evidence artifact ID (benchmark mode only)"
        type: string
        required: false
      benchmark_receipt_sha256:
        description: "Verified decompressed 38-row receipt SHA-256 (benchmark mode only)"
        type: string
        required: false
      base_sha:
        description: "Optional comparison base for changed-test selection"
        type: string
        required: false
      platform:
        description: "Native platform to qualify"
        type: choice
        options: [both, linux-x64, darwin-arm64]
        default: both
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'both' }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'native' }}
  cancel-in-progress: true

jobs:
  comparison:
    if: github.repository == 'openclaw/bun' && github.event_name == 'workflow_dispatch' && inputs.mode == 'comparison'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      COMPARISON_OUTPUT: /work/crabbox/openclaw-checker-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout frozen comparison carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout frozen OpenClaw source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 06af34cba25d549736807a334ca8028a1f6e9662
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Create comparison work directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 "$COMPARISON_OUTPUT"
      - name: Prepare verified archives and transport records
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 pipeline/scripts/openclaw-ci/checker-comparison/hosted.py prepare \
            "$GITHUB_WORKSPACE/source" \
            "$GITHUB_WORKSPACE/pipeline/scripts/openclaw-ci/checker-comparison/input" \
            "$COMPARISON_OUTPUT"
      - name: Run frozen 38-project comparison
        timeout-minutes: 95
        run: |
          python3 pipeline/scripts/openclaw-ci/checker-comparison/hosted.py run \
            "$GITHUB_WORKSPACE/source" \
            "$GITHUB_WORKSPACE/pipeline/scripts/openclaw-ci/checker-comparison/input" \
            "$COMPARISON_OUTPUT"
      - name: Preserve complete or partial comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-checker-matrix-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ${{ env.COMPARISON_OUTPUT }}/receipt.json.gz
            ${{ env.COMPARISON_OUTPUT }}/run-status.json
            ${{ env.COMPARISON_OUTPUT }}/executions.jsonl.gz
            ${{ env.COMPARISON_OUTPUT }}/receipt.recovery.json
            ${{ env.COMPARISON_OUTPUT }}/executions.recovery.jsonl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  benchmark:
    if: github.repository == 'openclaw/bun' && github.event_name == 'workflow_dispatch' && inputs.mode == 'benchmark'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      BENCHMARK_OUTPUT: /work/crabbox/openclaw-checker-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
      MATRIX_RUN_ID: ${{ inputs.benchmark_receipt_run_id }}
      MATRIX_ARTIFACT_ID: ${{ inputs.benchmark_receipt_artifact_id }}
      MATRIX_RECEIPT_SHA256: ${{ inputs.benchmark_receipt_sha256 }}
    steps:
      - name: Create benchmark work directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 "$BENCHMARK_OUTPUT"
      - name: Checkout frozen benchmark carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      - name: Checkout frozen OpenClaw source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 06af34cba25d549736807a334ca8028a1f6e9662
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Validate completed comparison binding
        run: |
          python3 - <<'PY'
          import os, re
          for name in ("MATRIX_RUN_ID", "MATRIX_ARTIFACT_ID"):
              if not re.fullmatch(r"[1-9][0-9]*", os.environ[name]):
                  raise SystemExit("benchmark requires one numeric " + name)
          if not re.fullmatch(r"[a-f0-9]{64}", os.environ["MATRIX_RECEIPT_SHA256"]):
              raise SystemExit("benchmark requires the verified decompressed receipt SHA-256")
          PY
      - name: Download exact completed comparison evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.benchmark_receipt_artifact_id }}
          run-id: ${{ inputs.benchmark_receipt_run_id }}
          repository: openclaw/bun
          github-token: ${{ github.token }}
          path: matrix-evidence
          digest-mismatch: error
      - name: Verify external completed receipt
        run: |
          python3 - <<'PY'
          import gzip, hashlib, os
          from pathlib import Path
          source = Path("matrix-evidence/receipt.json.gz")
          if not source.is_file() or source.is_symlink() or source.stat().st_size > 64 * 1024 ** 2:
              raise SystemExit("missing or oversized comparison receipt")
          with gzip.open(source, "rb") as stream:
              data = stream.read(256 * 1024 ** 2 + 1)
          if len(data) > 256 * 1024 ** 2 or hashlib.sha256(data).hexdigest() != os.environ["MATRIX_RECEIPT_SHA256"]:
              raise SystemExit("comparison receipt size or SHA-256 differs")
          with (Path(os.environ["BENCHMARK_OUTPUT"]) / "completed-matrix.json").open("xb") as target:
              target.write(data)
          PY
      - name: Prepare verified archives and transport records
        id: prepare
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 pipeline/scripts/openclaw-ci/checker-comparison/hosted.py prepare \
            "$GITHUB_WORKSPACE/source" \
            "$GITHUB_WORKSPACE/pipeline/scripts/openclaw-ci/checker-comparison/input" \
            "$BENCHMARK_OUTPUT"
      - name: Benchmark qualified core and UI graphs
        id: benchmark
        timeout-minutes: 70
        run: |
          timeout --signal=TERM --kill-after=5s 3000s python3 pipeline/scripts/openclaw-ci/checker-comparison/checker-benchmark-hosted.py \
            "$GITHUB_WORKSPACE/source" "$BENCHMARK_OUTPUT" \
            --receipt "$BENCHMARK_OUTPUT/completed-matrix.json" \
            --receipt-sha256 "$MATRIX_RECEIPT_SHA256"
      - name: Record benchmark workflow outcome
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = Path(os.environ["BENCHMARK_OUTPUT"]) / "benchmark-status.json"
          status = json.loads(target.read_text()) if target.exists() else {"phase": "preparation", "runExitCode": None}
          status["workflowOutcomes"] = {"prepare": os.environ["PREPARE_OUTCOME"], "benchmark": os.environ["BENCHMARK_OUTCOME"]}
          status["matrixArtifact"] = {"repository": "openclaw/bun", "runId": os.environ["MATRIX_RUN_ID"], "artifactId": os.environ["MATRIX_ARTIFACT_ID"], "receiptSha256": os.environ["MATRIX_RECEIPT_SHA256"]}
          target.write_text(json.dumps(status) + "\n")
          PY
      - name: Preserve benchmark results and failure status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-checker-benchmark-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ${{ env.BENCHMARK_OUTPUT }}/benchmark-status.json
            ${{ env.BENCHMARK_OUTPUT }}/run-status.json
            ${{ env.BENCHMARK_OUTPUT }}/dependency-receipt.json
            ${{ env.BENCHMARK_OUTPUT }}/benchmark/*/identity.json
            ${{ env.BENCHMARK_OUTPUT }}/benchmark/*/timing-*/manifest.json
            ${{ env.BENCHMARK_OUTPUT }}/benchmark/*/timing-*/summary.json
            ${{ env.BENCHMARK_OUTPUT }}/benchmark/*/timing-*/results.jsonl
            ${{ env.BENCHMARK_OUTPUT }}/benchmark/*/timing-*/*.stdout
            ${{ env.BENCHMARK_OUTPUT }}/benchmark/*/timing-*/*.stderr
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  linux-x64:
    if: github.repository == 'openclaw/bun' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'native' || inputs.mode == '') && (github.event_name != 'workflow_dispatch' || inputs.platform != 'darwin-arm64')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 115
    env:
      BUN_BUILD_CACHE_DIR: ${{ github.workspace }}/.cache/openclaw-build
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
      - name: Read toolchain pins
        id: pins
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          bun -e 'import { pins } from "./scripts/build/ci-images/spec.ts"; console.log(`llvm=${pins.llvm.version.split(".")[0]}\nnode=${pins.nodejs.version}\nrust=${pins.rust.channel}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install native build tools
        timeout-minutes: 15
        env:
          LLVM_MAJOR: ${{ steps.pins.outputs.llvm }}
          RUST_TOOLCHAIN: ${{ steps.pins.outputs.rust }}
        run: |
          curl -fsSL --retry 5 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_MAJOR} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build nasm ccache golang-go python3-fuse "clang-${LLVM_MAJOR}" "lld-${LLVM_MAJOR}" "llvm-${LLVM_MAJOR}"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          df -h /
      - name: Restore build caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/openclaw-build
            build/release/rust-target
            ~/.cargo/registry
            ~/.cargo/git
          key: openclaw-native-x64-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'bun.lock', 'test/bun.lock', 'rust-toolchain.toml', 'scripts/build/**', 'scripts/build.ts', '.github/workflows/openclaw-build-test.yml') }}-${{ steps.pins.outputs.tree }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openclaw-native-x64-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'bun.lock', 'test/bun.lock', 'rust-toolchain.toml', 'scripts/build/**', 'scripts/build.ts', '.github/workflows/openclaw-build-test.yml') }}-${{ steps.pins.outputs.tree }}-
      - name: Select tests
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/openclaw-ci/tests.ts select
      - name: Install build dependencies
        run: bun install --frozen-lockfile
      - name: Build native Linux x64 (release, no LTO)
        id: build
        timeout-minutes: 75
        env:
          CACHE_MATCH: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          started=$SECONDS
          timing() { echo "Build: $((SECONDS - started)) seconds; restored cache: ${CACHE_MATCH:-none}" >> "$GITHUB_STEP_SUMMARY"; }
          trap timing EXIT
          bun run build:release --lto=off --timings
      - name: Save build caches
        if: steps.build.outcome == 'success'
        run: CCACHE_DIR="$BUN_BUILD_CACHE_DIR/ccache" ccache --max-size=3G --cleanup --show-stats
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outcome == 'success'
        with:
          path: |
            .cache/openclaw-build
            build/release/rust-target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Package PR executable
        run: |
          tar -czf build/openclaw-ci/bun-linux-x64.tar.gz -C build/release bun
          (cd build/openclaw-ci && sha256sum bun-linux-x64.tar.gz > SHA256SUMS)
          git rev-parse HEAD > build/openclaw-ci/commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-linux-x64-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            build/openclaw-ci/bun-linux-x64.tar.gz
            build/openclaw-ci/SHA256SUMS
            build/openclaw-ci/commit.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Run selected and compatibility tests
        id: tests
        timeout-minutes: 20
        run: |
          started=$SECONDS
          timing() { echo "Tests: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"; }
          trap timing EXIT
          # build.ts only executes trailing arguments outside CI.
          ./build/release/bun scripts/openclaw-ci/tests.ts test
          test -s build/openclaw-ci/results.json
      - name: Summarize
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: bun scripts/openclaw-ci/tests.ts summary
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-test-report-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            build/openclaw-ci/*.json
            build/release/timings.html
            build/release/ccache.log
          retention-days: 7

  darwin-arm64:
    if: github.repository == 'openclaw/bun' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'native' || inputs.mode == '') && (github.event_name != 'workflow_dispatch' || inputs.platform != 'linux-x64')
    runs-on: macos-15
    timeout-minutes: 115
    env:
      BUN_BUILD_CACHE_DIR: ${{ github.workspace }}/.cache/openclaw-build
      PUPPETEER_SKIP_DOWNLOAD: "1"
      OPENCLAW_CI_PLATFORM: darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
      - name: Read toolchain pins
        id: pins
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          bun -e 'import { pins } from "./scripts/build/ci-images/spec.ts"; console.log(`llvm=${pins.llvm.version.split(".")[0]}\nnode=${pins.nodejs.version}\nrust=${pins.rust.channel}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install native build tools
        timeout-minutes: 15
        env:
          LLVM_MAJOR: ${{ steps.pins.outputs.llvm }}
          RUST_TOOLCHAIN: ${{ steps.pins.outputs.rust }}
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja nasm ccache go llvm
          llvm_bin="$(brew --prefix llvm)/bin"
          "$llvm_bin/clang" --version | grep -F "clang version ${LLVM_MAJOR}."
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "CC=$llvm_bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm_bin/clang++" >> "$GITHUB_ENV"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          df -h /
      - name: Restore build caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/openclaw-build
            build/release/rust-target
            ~/.cargo/registry
            ~/.cargo/git
          key: openclaw-native-darwin-arm64-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'bun.lock', 'test/bun.lock', 'rust-toolchain.toml', 'scripts/build/**', 'scripts/build.ts', '.github/workflows/openclaw-build-test.yml') }}-${{ steps.pins.outputs.tree }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openclaw-native-darwin-arm64-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'bun.lock', 'test/bun.lock', 'rust-toolchain.toml', 'scripts/build/**', 'scripts/build.ts', '.github/workflows/openclaw-build-test.yml') }}-${{ steps.pins.outputs.tree }}-
      - name: Select tests
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/openclaw-ci/tests.ts select
      - name: Install build dependencies
        run: bun install --frozen-lockfile
      - name: Build native macOS arm64 (release, no LTO)
        id: build
        timeout-minutes: 75
        env:
          CACHE_MATCH: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          started=$SECONDS
          timing() { echo "Build: $((SECONDS - started)) seconds; restored cache: ${CACHE_MATCH:-none}" >> "$GITHUB_STEP_SUMMARY"; }
          trap timing EXIT
          bun run build:release --lto=off --timings
      - name: Save build caches
        if: steps.build.outcome == 'success'
        run: CCACHE_DIR="$BUN_BUILD_CACHE_DIR/ccache" ccache --max-size=3G --cleanup --show-stats
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.build.outcome == 'success'
        with:
          path: |
            .cache/openclaw-build
            build/release/rust-target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Package PR executable
        run: |
          tar -czf build/openclaw-ci/bun-darwin-arm64.tar.gz -C build/release bun
          (cd build/openclaw-ci && shasum -a 256 bun-darwin-arm64.tar.gz > SHA256SUMS)
          git rev-parse HEAD > build/openclaw-ci/commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-darwin-arm64-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            build/openclaw-ci/bun-darwin-arm64.tar.gz
            build/openclaw-ci/SHA256SUMS
            build/openclaw-ci/commit.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Run selected and compatibility tests
        id: tests
        timeout-minutes: 20
        run: |
          started=$SECONDS
          timing() { echo "Tests: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"; }
          trap timing EXIT
          # build.ts only executes trailing arguments outside CI.
          ./build/release/bun scripts/openclaw-ci/tests.ts test
          test -s build/openclaw-ci/results.json
      - name: Summarize
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: bun scripts/openclaw-ci/tests.ts summary
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-test-report-darwin-arm64-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            build/openclaw-ci/*.json
            build/release/timings.html
            build/release/ccache.log
          retention-days: 7

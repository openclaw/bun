name: OpenClaw isolated reflection (temporary diagnosis)

on:
  workflow_dispatch:
    inputs:
      probe:
        type: choice
        options: [reflection, types, visible]
        default: reflection

permissions:
  contents: read
  actions: read

concurrency:
  group: receiver-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receiver-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
      - name: Verify the admitted native source and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/openclaw/bun/actions/artifacts/13670611811 --jq .workflow_run.id)" = 42609885305
          test "$(gh api repos/openclaw/bun/actions/artifacts/13670611811 --jq .workflow_run.head_sha)" = 11e3dd7ffa155cb63a38028adcc94be71553671d
          test "$(gh api repos/openclaw/bun/actions/artifacts/13670611811 --jq .digest)" = sha256:c046ee9348754ea6efcedf2a451e7bfaf6df1bbf671b8852c4daa359074e97dd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 13670611811
          run-id: 42609885305
          github-token: ${{ github.token }}
          path: build/openclaw-ci/native-input
      - name: Verify and unpack the admitted executable
        run: |
          cd build/openclaw-ci/native-input
          test "$(cat commit.txt)" = 11e3dd7ffa155cb63a38028adcc94be71553671d
          sha256sum -c SHA256SUMS
          mkdir -p ../../release
          tar -xzf bun-linux-x64.tar.gz -C ../../release bun bun.trim engine-source.json
          cd ../../..
          ./build/release/bun -e 'if (Bun.revision !== "11e3dd7ffa155cb63a38028adcc94be71553671d" || process.versions.webkit !== "651eeaca6e2792378928033b1ae7ac66d6f91eab") throw new Error("unadmitted source pair")'
      - name: Capture isolated receiver and surface observations
        if: inputs.probe == 'reflection' || inputs.probe == ''
        run: |
          ./build/release/bun install --frozen-lockfile
          node scripts/openclaw-ci/reflection-oracle.cjs
      - name: Replay only the visible descriptor and constructor walks
        if: inputs.probe == 'visible'
        run: node scripts/openclaw-ci/reflection-oracle.cjs --visible-only
      - name: Probe the exact node-class fixture's emitted type guards
        if: inputs.probe == 'types'
        run: |
          ./build/release/bun install --frozen-lockfile
          node scripts/openclaw-ci/node-class-guard-probe.cjs
      - name: Upload receiver controls
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receiver-oracle-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: build/openclaw-ci/receiver-oracle/
          if-no-files-found: error
          retention-days: 7

name: OpenClaw Execa early-error qualification

on: workflow_dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: execa-early-error-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
      - name: Verify the admitted native source and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/openclaw/bun/actions/artifacts/13753314663 --jq .workflow_run.id)" = 42793326534
          test "$(gh api repos/openclaw/bun/actions/artifacts/13753314663 --jq .workflow_run.head_sha)" = cd861bb9f53102e92e23ce28684c258055c7e612
          test "$(gh api repos/openclaw/bun/actions/artifacts/13753314663 --jq .digest)" = sha256:993294f9721a2984f1698ca10ecc6dbb84fd3f91eb9fc066f5eff8ea8a366236
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: 13753314663
          run-id: 42793326534
          github-token: ${{ github.token }}
          path: build/openclaw-ci/native-input
      - name: Verify and unpack the admitted executable
        run: |
          cd build/openclaw-ci/native-input
          test "$(cat commit.txt)" = cd861bb9f53102e92e23ce28684c258055c7e612
          sha256sum -c SHA256SUMS
          mkdir -p ../../release
          tar -xzf bun-linux-x64.tar.gz -C ../../release bun bun.trim engine-source.json
          cd ../../..
          ./build/release/bun -e 'if (Bun.revision !== "cd861bb9f53102e92e23ce28684c258055c7e612" || process.versions.webkit !== "651eeaca6e2792378928033b1ae7ac66d6f91eab") throw new Error("unadmitted source pair")'
      - name: Install the exact Execa package with a measured frozen lock
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/execa-early-error"
          report="$GITHUB_WORKSPACE/build/openclaw-ci/execa-early-error"
          mkdir -p "$inputs" "$report"
          printf '%s\n' '{"name":"execa-early-error-proof","private":true,"type":"module","dependencies":{"execa":"10.2.0"}}' > "$inputs/package.json"
          cd "$inputs"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const a=require("node:assert/strict"),p=require("./package-lock.json").packages["node_modules/execa"];a.equal(p.version,"10.2.0");a.equal(p.integrity,"sha512-j1pFOVxaybMVCTNHSBuISL2KQcDS3KIE1wBmUp4n2X+1FgaQI2ZDJVy9TYxDyMCzYojRIMh9O8X/UoWZtxTJdw==");a.equal(p.resolved,"https://registry.npmjs.org/execa/-/execa-10.2.0.tgz")'
          npm ci --ignore-scripts --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/scripts/openclaw-ci/execa-early-error-probe.mjs" ./probe.mjs
          cp package-lock.json "$report/package-lock.json"
      - name: Run the real Execa spawn-error entrypoint in Node and the native fork
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/build/openclaw-ci/execa-early-error"
          export EXECA_REPORT_DIR="$report"
          timeout --kill-after=5s 60s node "$RUNNER_TEMP/execa-early-error/probe.mjs" > "$report/node.log" 2>&1
          cat "$report/node.log"
          timeout --kill-after=5s 60s ./build/release/bun "$RUNNER_TEMP/execa-early-error/probe.mjs" > "$report/bun.log" 2>&1
          cat "$report/bun.log"
      - name: Upload the real-package error proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execa-early-error-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            build/openclaw-ci/execa-early-error/
          if-no-files-found: error
          retention-days: 7

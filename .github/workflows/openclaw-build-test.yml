name: W179 Darwin RSS qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w179-darwin-rss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  darwin-arm64:
    if: github.repository == 'openclaw/bun'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BUN_BUILD_CACHE_DIR: ${{ github.workspace }}/.cache/openclaw-build
      PUPPETEER_SKIP_DOWNLOAD: "1"
      OPENCLAW_CI_PLATFORM: darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0e6a7b354732a887a937f396db1283b8a1bd644e
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: ./pipeline/.github/actions/setup-bun
        with:
          bun-version: "1.4.2"
      - name: Read toolchain pins
        id: pins
        working-directory: source
        run: |
          # shellcheck disable=SC2016
          bun -e 'import { pins } from "./scripts/build/ci-images/spec.ts"; console.log(`llvm=${pins.llvm.version.split(".")[0]}\nnode=${pins.nodejs.version}\nrust=${pins.rust.channel}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install native build tools
        timeout-minutes: 15
        env:
          LLVM_MAJOR: ${{ steps.pins.outputs.llvm }}
          RUST_TOOLCHAIN: ${{ steps.pins.outputs.rust }}
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja nasm ccache go llvm
          llvm_bin="$(brew --prefix llvm)/bin"
          "$llvm_bin/clang" --version | grep -F "clang version ${LLVM_MAJOR}."
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "CC=$llvm_bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm_bin/clang++" >> "$GITHUB_ENV"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          sw_vers
          sysctl hw.memsize hw.ncpu
          df -h /
      - name: Install build dependencies
        working-directory: source
        run: bun install --frozen-lockfile
      - name: Build and compare three immutable engines
        run: python3 pipeline/scripts/w179/scripts/compare.py source evidence
      - name: Upload measurements and binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w179-darwin-rss-${{ github.sha }}
          path: evidence/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

name: OpenClaw AOT operation origins (temporary diagnosis)

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options:
          [
            linux-x64,
            darwin-arm64,
            darwin-cluster-regression,
            darwin-openclaw-repin,
            linux-openclaw-bun-only,
            linux-openclaw-repin,
            darwin-openclaw-app-host,
            linux-openclaw-doctor-causes,
            linux-openclaw-doctor-readiness,
            linux-openclaw-doctor-phases,
            linux-openclaw-doctor-fixture-fix,
            linux-openclaw-doctor-fixture-phases,
            linux-openclaw-invitation-retention,
            linux-openclaw-invitation-cache-code,
            linux-openclaw-invitation-owner-cut,
            linux-openclaw-invitation-references,
            linux-openclaw-invitation-operations,
            linux-openclaw-invitation-fulfillment,
            linux-openclaw-invitation-reduction,
            linux-openclaw-invitation-callback,
            linux-openclaw-invitation-snapshot,
            linux-openclaw-invitation-stack,
            linux-openclaw-invitation-gdb-attach,
            linux-openclaw-invitation-gdb-stack,
            linux-openclaw-invitation-fulfillment-stack,
            linux-openclaw-invitation-outcome-mappers,
            linux-openclaw-anchor-preparation,
            linux-openclaw-anchor-full-context,
            linux-openclaw-anchor-fixture-fix,
            linux-openclaw-doctor-continuation,
            linux-openclaw-doctor-failure-phases,
            linux-openclaw-profile-layout,
            linux-openclaw-profile-symbols,
            linux-openclaw-doctor-fixture-regression,
          ]
        default: linux-x64
      webkit_source_sha:
        description: Diagnostic engine commit, required only for the Linux operation-origin probe
        type: string
        required: false
      cluster_fixed_artifact:
        description: Native Darwin bundle from pinned run 43739822593; required only for the cluster regression proof
        type: string
        required: false
      openclaw_candidate_sha:
        description: Full reviewed OpenClaw pin PR SHA; required only for the Darwin repin comparison
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: aot-operation-origins-${{ github.ref }}${{ inputs.platform == 'linux-openclaw-bun-only' && '-bun-only' || inputs.platform == 'linux-openclaw-repin' && '-linux-repin' || inputs.platform == 'darwin-openclaw-app-host' && '-app-host' || inputs.platform == 'linux-openclaw-doctor-causes' && '-doctor-causes' || inputs.platform == 'linux-openclaw-doctor-readiness' && '-doctor-readiness' || inputs.platform == 'linux-openclaw-doctor-phases' && '-doctor-phases' || inputs.platform == 'linux-openclaw-doctor-fixture-fix' && '-doctor-fixture-fix' || inputs.platform == 'linux-openclaw-doctor-fixture-phases' && '-doctor-fixture-phases' || inputs.platform == 'linux-openclaw-invitation-reduction' && '-invitation-reduction' || inputs.platform == 'linux-openclaw-invitation-fulfillment' && '-invitation-fulfillment' || inputs.platform == 'linux-openclaw-invitation-operations' && '-invitation-operations' || inputs.platform == 'linux-openclaw-invitation-references' && '-invitation-references' || inputs.platform == 'linux-openclaw-invitation-owner-cut' && '-invitation-owner-cut' || inputs.platform == 'linux-openclaw-invitation-cache-code' && '-invitation-cache-code' || inputs.platform == 'linux-openclaw-invitation-retention' && '-invitation-retention' || inputs.platform == 'linux-openclaw-invitation-callback' && '-invitation-callback' || inputs.platform == 'linux-openclaw-invitation-outcome-mappers' && '-invitation-outcome-mappers' || inputs.platform == 'linux-openclaw-invitation-fulfillment-stack' && '-invitation-fulfillment-stack' || inputs.platform == 'linux-openclaw-invitation-gdb-stack' && '-invitation-gdb-stack' || inputs.platform == 'linux-openclaw-invitation-gdb-attach' && '-invitation-gdb-attach' || inputs.platform == 'linux-openclaw-invitation-stack' && '-invitation-stack' || inputs.platform == 'linux-openclaw-invitation-snapshot' && '-invitation-snapshot' || inputs.platform == 'linux-openclaw-anchor-fixture-fix' && '-anchor-fixture-fix' || inputs.platform == 'linux-openclaw-anchor-full-context' && '-anchor-full-context' || inputs.platform == 'linux-openclaw-anchor-preparation' && '-anchor-preparation' || inputs.platform == 'linux-openclaw-doctor-continuation' && '-doctor-continuation' || inputs.platform == 'linux-openclaw-profile-symbols' && '-profile-symbols' || inputs.platform == 'linux-openclaw-profile-layout' && '-profile-layout' || inputs.platform == 'linux-openclaw-doctor-fixture-regression' && '-doctor-fixture-regression' || inputs.platform == 'linux-openclaw-doctor-failure-phases' && '-doctor-failure-phases' || '' }}
  cancel-in-progress: true

jobs:
  openclaw-doctor-fixture-regression:
    if: inputs.platform == 'linux-openclaw-doctor-fixture-regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Require the reviewed actual regression commit
        env:
          CANDIDATE_SHA: ${{ inputs.openclaw_candidate_sha }}
        run: test "$CANDIDATE_SHA" = 58778fd27ca2e8725f30a8fd5aa2da0b1b82a855
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 58778fd27ca2e8725f30a8fd5aa2da0b1b82a855
          fetch-depth: 2
          path: source
          persist-credentials: false
      - name: Admit signed source before executing candidate code
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          OPENCLAW_SOURCE_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/openclaw-ci/doctor-fixture-regression.py --phase metadata --source source \
            --candidate-sha 58778fd27ca2e8725f30a8fd5aa2da0b1b82a855 \
            --controller-sha "$CONTROLLER_SHA" --out doctor-fixture-regression-proof
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Run the unchanged focused Node fixture without credentials
        env:
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          controller_home="$RUNNER_TEMP/doctor-fixture-regression-home"
          controller_tmp="$RUNNER_TEMP/doctor-fixture-regression-tmp"
          install -d -m 0700 "$controller_home" "$controller_tmp"
          env -i PATH="$PATH" HOME="$controller_home" TMPDIR="$controller_tmp" LANG=C.UTF-8 CI=true \
            python3 scripts/openclaw-ci/doctor-fixture-regression.py --phase execute --source source \
            --candidate-sha 58778fd27ca2e8725f30a8fd5aa2da0b1b82a855 \
            --controller-sha "$CONTROLLER_SHA" --out doctor-fixture-regression-proof
      - name: Check bounded text-only fixture evidence
        id: doctor-fixture-regression-budget
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("doctor-fixture-regression-proof")
          assert (root / "report.json").is_file()
          files = list(root.iterdir())
          assert len(files) <= 11 and all(p.is_file() and not p.is_symlink() and p.suffix in {".json", ".log"} for p in files)
          assert sum(p.stat().st_size for p in files) <= 48 * 1024 * 1024
          for p in files:
              p.read_text(encoding="utf-8")
          PY
      - name: Upload only text fixture evidence
        if: ${{ always() && steps.doctor-fixture-regression-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-doctor-fixture-regression-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: doctor-fixture-regression-proof/
          if-no-files-found: error
          retention-days: 7

  openclaw-profile-layout:
    if: inputs.platform == 'linux-openclaw-profile-layout' || inputs.platform == 'linux-openclaw-profile-symbols'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Admit the exact published profile metadata
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          BUN_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/openclaw-ci/profile-layout.py --phase metadata \
            --controller-sha "$CONTROLLER_SHA" --out profile-layout-proof
      - name: Inspect profile metadata without credentials or binary execution
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          INSPECT_PHASE: ${{ inputs.platform == 'linux-openclaw-profile-symbols' && 'symbols' || 'inspect' }}
        run: |
          controller_home="$RUNNER_TEMP/profile-layout-home"
          controller_tmp="$RUNNER_TEMP/profile-layout-tmp"
          install -d -m 0700 "$controller_home" "$controller_tmp"
          env -i PATH="$PATH" HOME="$controller_home" TMPDIR="$controller_tmp" LANG=C CI=true \
            python3 scripts/openclaw-ci/profile-layout.py --phase "$INSPECT_PHASE" \
            --controller-sha "$CONTROLLER_SHA" --out profile-layout-proof
      - name: Check bounded structural-only evidence
        id: profile-layout-budget
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("profile-layout-proof")
          files = list(root.iterdir())
          assert (root / "report.json").is_file()
          assert {p.name for p in files} <= {"report.json", "metadata.json"}
          assert all(p.is_file() and not p.is_symlink() for p in files)
          assert sum(p.stat().st_size for p in files) <= 64 * 1024
          for p in files:
              p.read_text(encoding="utf-8")
          PY
      - name: Upload only structural profile evidence
        if: ${{ always() && steps.profile-layout-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-profile-layout-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: profile-layout-proof/
          if-no-files-found: error
          retention-days: 7

  openclaw-doctor-failure-phases:
    if: inputs.platform == 'linux-openclaw-doctor-failure-phases'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Require the reviewed diagnostic candidate
        env:
          CANDIDATE_SHA: ${{ inputs.openclaw_candidate_sha }}
        run: test "$CANDIDATE_SHA" = bf665f2db8cbfed047cd084d9ee4ed333653549b
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: bf665f2db8cbfed047cd084d9ee4ed333653549b
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Admit source and published Bun before candidate execution
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          BUN_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/openclaw-ci/openclaw-repin-regression.py --phase metadata --source source \
            --candidate-sha bf665f2db8cbfed047cd084d9ee4ed333653549b --controller-sha "$CONTROLLER_SHA" --out doctor-failure-phases-proof
      - name: Replay the frozen Doctor group with failure-only phase capture
        env:
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          controller_home="$RUNNER_TEMP/doctor-failure-phases-controller-home"
          controller_tmp="$RUNNER_TEMP/doctor-failure-phases-controller-tmp"
          install -d -m 0700 "$controller_home" "$controller_tmp"
          env -i PATH="$PATH" HOME="$controller_home" TMPDIR="$controller_tmp" LANG=C.UTF-8 CI=true \
            python3 scripts/openclaw-ci/openclaw-linux-repin.py --source source --out doctor-failure-phases-proof \
            --controller-sha "$CONTROLLER_SHA" --group doctor-current --pin new --doctor-failure-phases
      - name: Check bounded text-only diagnostic evidence
        id: doctor-failure-phases-budget
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("doctor-failure-phases-proof")
          assert (root / "report.json").is_file(), "missing diagnostic receipt"
          files = list(root.iterdir())
          assert len(files) <= 20 and all(p.is_file() and not p.is_symlink() and p.suffix in {".json", ".log"} for p in files)
          assert sum(p.stat().st_size for p in files) <= 64 * 1024 * 1024
          for p in files:
              p.read_text(encoding="utf-8")
          PY
      - name: Upload only text Doctor failure-phase evidence
        if: ${{ always() && steps.doctor-failure-phases-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-doctor-failure-phases-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: doctor-failure-phases-proof/
          if-no-files-found: error
          retention-days: 7

  openclaw-doctor-continuation:
    if: inputs.platform == 'linux-openclaw-doctor-continuation'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pin: [old, new]
    permissions:
      contents: read
    steps:
      - name: Require the reviewed diagnostic candidate
        env:
          CANDIDATE_SHA: ${{ inputs.openclaw_candidate_sha }}
        run: test "$CANDIDATE_SHA" = 4ea5babab09c338812ae50dbcdaed990f48cd0fc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 4ea5babab09c338812ae50dbcdaed990f48cd0fc
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Admit source and published Bun before candidate execution
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          BUN_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/openclaw-ci/openclaw-repin-regression.py --phase metadata --source source \
            --candidate-sha 4ea5babab09c338812ae50dbcdaed990f48cd0fc --controller-sha "$CONTROLLER_SHA" --out doctor-continuation-proof
      - name: Run the unchanged Doctor continuation file without credentials
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          PIN: ${{ matrix.pin }}
        run: |
          controller_home="$RUNNER_TEMP/doctor-continuation-controller-home"
          controller_tmp="$RUNNER_TEMP/doctor-continuation-controller-tmp"
          install -d -m 0700 "$controller_home" "$controller_tmp"
          env -i PATH="$PATH" HOME="$controller_home" TMPDIR="$controller_tmp" LANG=C.UTF-8 CI=true \
            python3 scripts/openclaw-ci/openclaw-linux-repin.py --source source --out doctor-continuation-proof \
            --controller-sha "$CONTROLLER_SHA" --group large5 --pin "$PIN" --doctor-continuation
      - name: Check bounded text-only diagnostic evidence
        id: doctor-continuation-budget
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("doctor-continuation-proof")
          assert (root / "report.json").is_file(), "missing diagnostic receipt"
          files = list(root.iterdir())
          assert len(files) <= 20 and all(p.is_file() and not p.is_symlink() and p.suffix in {".json", ".log"} for p in files)
          assert sum(p.stat().st_size for p in files) <= 64 * 1024 * 1024
          for p in files:
              p.read_text(encoding="utf-8")
          PY
      - name: Upload only text Doctor continuation evidence
        if: ${{ always() && steps.doctor-continuation-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-doctor-continuation-${{ matrix.pin }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: doctor-continuation-proof/
          if-no-files-found: error
          retention-days: 7

  openclaw-anchor-preparation:
    if: inputs.platform == 'linux-openclaw-anchor-preparation' || inputs.platform == 'linux-openclaw-anchor-full-context' || inputs.platform == 'linux-openclaw-anchor-fixture-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Require the reviewed diagnostic candidate
        env:
          CANDIDATE_SHA: ${{ inputs.openclaw_candidate_sha }}
        run: test "$CANDIDATE_SHA" = 4ea5babab09c338812ae50dbcdaed990f48cd0fc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 4ea5babab09c338812ae50dbcdaed990f48cd0fc
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Admit source and published Bun before candidate execution
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          BUN_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/openclaw-ci/openclaw-repin-regression.py --phase metadata --source source \
            --candidate-sha 4ea5babab09c338812ae50dbcdaed990f48cd0fc --controller-sha "$CONTROLLER_SHA" --out anchor-preparation-proof
      - name: Run the selected POSIX preparation diagnostic without credentials
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          ANCHOR_FULL_CONTEXT: ${{ inputs.platform == 'linux-openclaw-anchor-full-context' }}
          ANCHOR_FIXTURE_FIX: ${{ inputs.platform == 'linux-openclaw-anchor-fixture-fix' }}
        run: |
          context_args=(--anchor-preparation)
          if [ "$ANCHOR_FULL_CONTEXT" = true ]; then context_args+=(--anchor-full-context); fi
          if [ "$ANCHOR_FIXTURE_FIX" = true ]; then context_args=(--anchor-fixture-fix); fi
          controller_home="$RUNNER_TEMP/anchor-preparation-controller-home"
          controller_tmp="$RUNNER_TEMP/anchor-preparation-controller-tmp"
          install -d -m 0700 "$controller_home" "$controller_tmp"
          env -i PATH="$PATH" HOME="$controller_home" TMPDIR="$controller_tmp" LANG=C.UTF-8 CI=true \
            python3 scripts/openclaw-ci/openclaw-linux-repin.py --source source --out anchor-preparation-proof \
            --controller-sha "$CONTROLLER_SHA" --group large42_process --pin new "${context_args[@]}"
      - name: Check bounded text-only diagnostic evidence
        id: anchor-preparation-budget
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("anchor-preparation-proof")
          assert (root / "report.json").is_file(), "missing diagnostic receipt"
          files = list(root.iterdir())
          assert len(files) <= 20 and all(p.is_file() and not p.is_symlink() and p.suffix in {".json", ".log"} for p in files)
          assert sum(p.stat().st_size for p in files) <= 64 * 1024 * 1024
          for p in files:
              p.read_text(encoding="utf-8")
          PY
      - name: Upload only text POSIX preparation evidence
        if: ${{ always() && steps.anchor-preparation-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-anchor-preparation-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: anchor-preparation-proof/
          if-no-files-found: error
          retention-days: 7

  openclaw-invitation-snapshot:
    if: inputs.platform == 'linux-openclaw-invitation-snapshot' || inputs.platform == 'linux-openclaw-invitation-stack' || inputs.platform == 'linux-openclaw-invitation-gdb-attach' || inputs.platform == 'linux-openclaw-invitation-gdb-stack' || inputs.platform == 'linux-openclaw-invitation-fulfillment-stack'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Require the reviewed diagnostic candidate
        env:
          CANDIDATE_SHA: ${{ inputs.openclaw_candidate_sha }}
        run: test "$CANDIDATE_SHA" = 4ea5babab09c338812ae50dbcdaed990f48cd0fc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 4ea5babab09c338812ae50dbcdaed990f48cd0fc
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Install the read-only stack debugger
        if: inputs.platform == 'linux-openclaw-invitation-stack'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lldb
          test -x /usr/bin/lldb
      - name: Admit the published profile companion
        if: inputs.platform == 'linux-openclaw-invitation-stack' || inputs.platform == 'linux-openclaw-invitation-gdb-attach' || inputs.platform == 'linux-openclaw-invitation-gdb-stack' || inputs.platform == 'linux-openclaw-invitation-fulfillment-stack'
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          BUN_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/openclaw-ci/profile-layout.py --phase metadata --controller-sha "$CONTROLLER_SHA" --out invitation-profile-proof
      - name: Install the GDB diagnostic debugger
        if: inputs.platform == 'linux-openclaw-invitation-gdb-attach' || inputs.platform == 'linux-openclaw-invitation-gdb-stack' || inputs.platform == 'linux-openclaw-invitation-fulfillment-stack'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb
          test -x /usr/bin/gdb
      - name: Admit source and published Bun before candidate execution
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          BUN_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/openclaw-ci/openclaw-repin-regression.py --phase metadata --source source \
            --candidate-sha 4ea5babab09c338812ae50dbcdaed990f48cd0fc --controller-sha "$CONTROLLER_SHA" --out invitation-snapshot-proof
      - name: Observe bounded invitation snapshot structure without credentials
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          OBSERVE_STACK: ${{ inputs.platform == 'linux-openclaw-invitation-stack' }}
          GDB_ATTACH: ${{ inputs.platform == 'linux-openclaw-invitation-gdb-attach' }}
          GDB_STACK: ${{ inputs.platform == 'linux-openclaw-invitation-gdb-stack' || inputs.platform == 'linux-openclaw-invitation-fulfillment-stack' }}
          FULFILLMENT_STACK: ${{ inputs.platform == 'linux-openclaw-invitation-fulfillment-stack' }}
        run: |
          stack_args=()
          if [ "$OBSERVE_STACK" = true ]; then stack_args+=(--invitation-stack); fi
          if [ "$GDB_ATTACH" = true ]; then stack_args+=(--invitation-stack --invitation-gdb-attach); fi

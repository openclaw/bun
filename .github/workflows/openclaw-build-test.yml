name: OpenClaw upstream import-format qualification

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [linux-x64]
        default: linux-x64
      webkit_source_sha:
        description: Exact stock engine 5a61071f79134bf41844e7ea31a8449147d85dd4
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: upstream-import-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module-format:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      BUN_BUILD_CACHE_DIR: ${{ github.workspace }}/source/baseline/.cache/stock-build
      PUPPETEER_SKIP_DOWNLOAD: "1"
      WEBKIT_SOURCE_SHA: ${{ inputs.webkit_source_sha }}
      EXPECTED_NATIVE_SHA: ecebf1d0165be75580864a41da9240436ff0e974
    steps:
      - name: Validate source-pair request
        working-directory: .
        if: inputs.webkit_source_sha != ''
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          test "$PLATFORM" = linux-x64
          test "$WEBKIT_SOURCE_SHA" = 5a61071f79134bf41844e7ea31a8449147d85dd4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2d5e55119fb50ee5d79af2552703193ef7b0f46f
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ecebf1d0165be75580864a41da9240436ff0e974
          path: source/baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.webkit_source_sha != ''
        with:
          repository: oven-sh/WebKit
          ref: ${{ inputs.webkit_source_sha }}
          path: source/.openclaw-webkit
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/
            !/JSTests/
            !/PerformanceTests/
            !/Websites/
            !/ManualTests/
            !/WebDriverTests/
      - name: Record source-pair identity
        if: inputs.webkit_source_sha != ''
        run: |
          test "$(git -C .openclaw-webkit rev-parse HEAD)" = "$WEBKIT_SOURCE_SHA"
          test -z "$(git -C .openclaw-webkit status --porcelain)"
          mkdir -p build/openclaw-ci
          python3 -c 'import json,subprocess; from pathlib import Path; rev=lambda *args: subprocess.check_output(["git",*args],text=True).strip(); Path("build/openclaw-ci/engine-source.json").write_text(json.dumps({"mode":"source", "bun":{"sha":rev("-C","baseline","rev-parse","HEAD"),"tree":rev("-C","baseline","rev-parse","HEAD^{tree}")},"webkit":{"repository":"oven-sh/WebKit","sha":rev("-C",".openclaw-webkit","rev-parse","HEAD"),"tree":rev("-C",".openclaw-webkit","rev-parse","HEAD^{tree}")},"shippingArchiveQualified":False},indent=2)+"\n")'
          echo "BUN_WEBKIT_PATH=$GITHUB_WORKSPACE/source/.openclaw-webkit" >> "$GITHUB_ENV"
          echo 'Exact upstream import-format qualification only; this does not qualify shipping or the full suite.' >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.4"
      - name: Read toolchain pins
        id: pins
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          bun -e 'import { locations, pins } from "./scripts/build/ci-images/spec.ts"; console.log(`llvm-directory=${locations.llvm}\nnode=${pins.nodejs.version}\nrust=${pins.rust.channel}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install native build tools
        timeout-minutes: 15
        env:
          LLVM_DIRECTORY: ${{ steps.pins.outputs.llvm-directory }}
          RUST_TOOLCHAIN: ${{ steps.pins.outputs.rust }}
        run: |
          bash scripts/openclaw-ci/install-linux-toolchain.sh
          if test -n "$WEBKIT_SOURCE_SHA"; then
            sudo apt-get install -y --no-install-recommends libicu-dev pkg-config ruby perl
            # Trimming reads ICU data from the executable, so use its static input contract.
            icu_root="$RUNNER_TEMP/source-pair-icu"
            icu_include=$(pkg-config --variable=includedir icu-uc)
            icu_lib=$(pkg-config --variable=libdir icu-uc)
            test -s "$icu_include/unicode/utypes.h"
            for library in libicui18n.a libicuuc.a libicudata.a; do test -s "$icu_lib/$library"; done
            mkdir -p "$icu_root"
            ln -s "$icu_include" "$icu_root/include"
            ln -s "$icu_lib" "$icu_root/lib"
            echo "BUN_ICU_ROOT=$icu_root" >> "$GITHUB_ENV"
            echo "Source-pair ICU: $(pkg-config --modversion icu-uc), static system archives." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify the matched static ICU input
        run: |
          mkdir -p build/openclaw-ci/aot-baseline
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["BUN_ICU_ROOT"])
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={"version":subprocess.check_output(["pkg-config","--modversion","icu-uc"],text=True).strip(),
                   "archives":{name:digest(root/"lib"/name) for name in ("libicui18n.a","libicuuc.a","libicudata.a")},
                   "headers":{p.name:digest(p) for p in sorted((root/"include/unicode").glob("*.h"))}}
          checksum=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          receipt.update(referenceSHA256="119094f556f6bb38db24f3ec0665778f5bddea27d94b4500b2cf87f0e1e0a515",actualSHA256=checksum,referenceMatch=checksum=="119094f556f6bb38db24f3ec0665778f5bddea27d94b4500b2cf87f0e1e0a515")
          Path("build/openclaw-ci/aot-baseline/icu.json").write_text(json.dumps(receipt,indent=2)+"\n")
          assert receipt["referenceMatch"],"static ICU input differs from matched stock control"
          PY
      - name: Restore build caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            source/baseline/.cache/stock-build
            source/baseline/build/release/rust-target
            ~/.cargo/registry
            ~/.cargo/git
          key: upstream-import-format-ecebf1d0165be75580864a41da9240436ff0e974-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'bun.lock', 'test/bun.lock', 'rust-toolchain.toml', 'scripts/build/**', 'scripts/build.ts', '.github/workflows/openclaw-build-test.yml') }}-${{ steps.pins.outputs.tree }}-${{ inputs.webkit_source_sha || 'pinned' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            upstream-import-format-ecebf1d0165be75580864a41da9240436ff0e974-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'bun.lock', 'test/bun.lock', 'rust-toolchain.toml', 'scripts/build/**', 'scripts/build.ts', '.github/workflows/openclaw-build-test.yml') }}-${{ steps.pins.outputs.tree }}-${{ inputs.webkit_source_sha || 'pinned' }}-
      - name: Install frozen source and baseline type dependencies
        run: |
          test "$(git rev-parse HEAD)" = 2d5e55119fb50ee5d79af2552703193ef7b0f46f
          test "$(git -C baseline rev-parse HEAD)" = "$EXPECTED_NATIVE_SHA"
          test "$(git -C baseline rev-parse 'HEAD^{tree}')" = c36c28e521bb6a32175f1b0adaea8bd195328bd3
          test "$(git -C .openclaw-webkit rev-parse 'HEAD^{tree}')" = 5a21495a118101dc8043246d8805babb8ebdcf60
          bun install --frozen-lockfile
          (cd baseline && bun install --frozen-lockfile)
      - name: Verify identical stock and provisioning toolchain pins
        run: |
          bun -e 'import { strict as assert } from "node:assert"; import { pins } from "./scripts/build/ci-images/spec.ts"; import { pins as stock } from "./baseline/scripts/build/ci-images/spec.ts"; assert.deepEqual(stock.llvm,pins.llvm); assert.deepEqual(stock.rust,pins.rust)'
      - name: Build the reviewed upstream source pair
        timeout-minutes: 75
        run: |
          unset BUILDKITE_COMMIT GIT_SHA
          export GITHUB_SHA="$EXPECTED_NATIVE_SHA"
          cd baseline
          mkdir -p ../build/openclaw-ci/aot-baseline
          bun -e '
            import { configOf } from "./scripts/build/configure.ts";
            const { cfg } = configOf({ profile: "release", overrides: { ci: true, trimmable: true, webkit: "local", webkitVersion: process.env.WEBKIT_SOURCE_SHA } });
            const { buildType, ci, lto, trimmable, webkit, webkitVersion, revision, cc, ld, rustToolchain } = cfg;
            if (buildType !== "Release" || !ci || !lto || !trimmable || webkit !== "local" ||
                revision !== process.env.EXPECTED_NATIVE_SHA || webkitVersion !== process.env.WEBKIT_SOURCE_SHA)
              throw new Error("Unexpected stock reproduction build configuration");
            console.log(JSON.stringify({ buildType, ci, lto, trimmable, webkit, webkitVersion, revision, cc, ld, rustToolchain }));
          ' > ../build/openclaw-ci/aot-baseline/probe-build.json
          bun scripts/build.ts --profile=release --ci=on --trimmable=on --webkit=local --webkit-version="$WEBKIT_SOURCE_SHA" --timings
          mkdir -p build/release/bun.trim
          cp build/release/bun-profile.trim/*.txt build/release/bun.trim/
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C ../.openclaw-webkit status --porcelain --untracked-files=no)"
      - name: Verify imported TSX parity against the reviewed executable
        working-directory: source/baseline
        run: node ../../scripts/openclaw-ci/module-format-stock-probe.cjs
      - name: Check the changed Rust source format
        working-directory: source/baseline
        run: rustfmt --edition 2024 --check src/sema/resolve/code/search.rs src/aot/load/contents/tests.rs
      - name: Verify module-load analysis including the inverse extension case
        working-directory: source/baseline
        timeout-minutes: 20
        run: |
          BUN_CODEGEN_DIR="$GITHUB_WORKSPACE/source/baseline/build/release/codegen" CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0 \
            CARGO_PROFILE_DEV_OPT_LEVEL=1 CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS='-Cforce-frame-pointers=yes -Zthreads=8' \
            cargo test --no-fail-fast -p bun_aot --lib load::contents::tests::file_found_for_a_load_is_read_as_that_load_reads_it
      - name: Run the owning CLI parity and evaluation-order regressions
        working-directory: source/baseline
        timeout-minutes: 10
        run: |
          ./build/release/bun install --frozen-lockfile
          (cd test && ../build/release/bun install --frozen-lockfile)
          mkdir -p ../build/openclaw-ci/module-format-stock
          ./build/release/bun test ./test/cli/run/run-aot.test.ts \
            --test-name-pattern 'in-place \.(jsx|tsx) module format matches the runtime|files that are CommonJS only by name' \
            --reporter=junit --reporter-outfile=../build/openclaw-ci/module-format-stock/cli.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          rows=[r for r in ET.parse('../build/openclaw-ci/module-format-stock/cli.xml').iter('testcase') if r.find('skipped') is None]
          assert len(rows)==16,len(rows)
          assert all(r.find('failure') is None for r in rows)
          print('All six JSX/TSX parity/order/require cases and ten existing CommonJS cases pass.')
          PY
      - name: Upload upstream import qualification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-import-format-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            source/build/openclaw-ci/*.json
            source/build/openclaw-ci/aot-baseline/*.json
            source/build/openclaw-ci/aot-baseline/*.log
            source/build/openclaw-ci/module-format-stock/*.xml
            source/build/openclaw-ci/module-format-stock/*.json
            source/build/openclaw-ci/module-format-stock/*.log
            source/build/openclaw-ci/receiver-oracle/node-class-guards/*.json
            source/build/openclaw-ci/receiver-oracle/node-class-guards/*.log
            source/baseline/build/release/timings.html
          if-no-files-found: error
          retention-days: 7

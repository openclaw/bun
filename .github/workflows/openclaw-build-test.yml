    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 4ea5babab09c338812ae50dbcdaed990f48cd0fc
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Admit source and both public releases before candidate execution
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          BUN_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/openclaw-ci/openclaw-repin-regression.py --phase metadata --source source \
            --candidate-sha 4ea5babab09c338812ae50dbcdaed990f48cd0fc --controller-sha "$CONTROLLER_SHA" --out linux-repin-proof
      - name: Run the canonical group with its admitted Bun pin without credentials
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          GROUP: ${{ matrix.group }}
          PIN: ${{ matrix.pin }}
        run: |
          controller_home="$RUNNER_TEMP/linux-repin-controller-home"
          controller_tmp="$RUNNER_TEMP/linux-repin-controller-tmp"
          install -d -m 0700 "$controller_home" "$controller_tmp"
          env -i PATH="$PATH" HOME="$controller_home" TMPDIR="$controller_tmp" LANG=C.UTF-8 CI=true \
            python3 scripts/openclaw-ci/openclaw-linux-repin.py --source source --out linux-repin-proof \
            --controller-sha "$CONTROLLER_SHA" --group "$GROUP" --pin "$PIN"
      - name: Check complete bounded text-only group evidence
        id: linux-repin-budget
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("linux-repin-proof")
          assert (root / "report.json").is_file(), "missing group receipt"
          files = list(root.iterdir())
          assert len(files) <= 20 and all(p.is_file() and not p.is_symlink() and p.suffix in {".json", ".log"} for p in files)
          assert sum(p.stat().st_size for p in files) <= 64 * 1024 * 1024
          for p in files:
              p.read_text(encoding="utf-8")
          PY
      - name: Upload only text group evidence
        if: ${{ always() && steps.linux-repin-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-linux-repin-${{ matrix.group }}-${{ matrix.pin }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: linux-repin-proof/
          if-no-files-found: error
          retention-days: 7

  openclaw-bun-only:
    if: inputs.platform == 'linux-openclaw-bun-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 4ea5babab09c338812ae50dbcdaed990f48cd0fc
          path: source
          persist-credentials: false
      - name: Admit the exact reviewed candidate before running its code
        env:
          BUN_ONLY_WORK: ${{ runner.temp }}/openclaw-bun-only-${{ github.run_id }}-${{ github.run_attempt }}
          DOCKER_CONFIG: ${{ runner.temp }}/openclaw-bun-only-${{ github.run_id }}-${{ github.run_attempt }}/docker
        run: |
          test "$(git -C source rev-parse HEAD)" = 4ea5babab09c338812ae50dbcdaed990f48cd0fc
          test -z "$(git -C source status --porcelain)"
          test ! -e "$BUN_ONLY_WORK"
          install -d -m 0700 "$BUN_ONLY_WORK" "$DOCKER_CONFIG"
          printf 'BUN_ONLY_WORK=%s\nDOCKER_CONFIG=%s\n' "$BUN_ONLY_WORK" "$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.23.0
      - name: Package and run the canonical Bun-only smoke without credentials
        run: /bin/bash scripts/openclaw-ci/openclaw-bun-only-smoke.sh "$GITHUB_WORKSPACE/source" "$BUN_ONLY_WORK" "$GITHUB_WORKSPACE/bun-only-proof" "$GITHUB_SHA"
      - name: Check bounded text-only smoke evidence
        id: bun-only-budget
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("bun-only-proof")
          assert (root / "receipt.json").is_file(), "missing smoke receipt"
          files = list(root.iterdir())
          assert len(files) <= 400 and all(p.is_file() and not p.is_symlink() and p.suffix in {".json", ".md", ".log"} for p in files)
          assert sum(p.stat().st_size for p in files) <= 64 * 1024 * 1024
          for p in files:
              p.read_text(encoding="utf-8")
          PY
      - name: Upload only text Bun-only evidence
        if: ${{ always() && steps.bun-only-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-bun-only-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: bun-only-proof/
          if-no-files-found: error
          retention-days: 7

  openclaw-repin:
    if: inputs.platform == 'darwin-openclaw-repin'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Validate immutable source request
        env:
          CANDIDATE_SHA: ${{ inputs.openclaw_candidate_sha }}
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$(uname -m)" = arm64'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.openclaw_candidate_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Admit public release metadata before candidate execution
        env:
          CANDIDATE_SHA: ${{ inputs.openclaw_candidate_sha }}
          CONTROLLER_SHA: ${{ github.sha }}
          BUN_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: python3 scripts/openclaw-ci/openclaw-repin-regression.py --phase metadata --source source --candidate-sha "$CANDIDATE_SHA" --controller-sha "$CONTROLLER_SHA" --out repin-proof
      - name: Compare the current derived regression set without credentials
        env:
          CANDIDATE_SHA: ${{ inputs.openclaw_candidate_sha }}
          CONTROLLER_SHA: ${{ github.sha }}
        run: |
          controller_home="$RUNNER_TEMP/repin-controller-home"
          controller_tmp="$RUNNER_TEMP/repin-controller-tmp"
          install -d -m 0700 "$controller_home" "$controller_tmp"
          env -i PATH="$PATH" HOME="$controller_home" TMPDIR="$controller_tmp" LANG=en_US.UTF-8 CI=true \
            python3 scripts/openclaw-ci/openclaw-repin-regression.py --phase execute --source source \
            --candidate-sha "$CANDIDATE_SHA" --controller-sha "$CONTROLLER_SHA" --out repin-proof
      - name: Check text-only evidence budget
        id: repin-budget
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("repin-proof")
          files = list(root.rglob("*"))
          assert (root / "report.json").is_file(), "missing diagnostic receipt"
          assert all(not p.is_symlink() and (p.is_dir() or p.suffix in {".json", ".log"}) for p in files)
          files = [p for p in files if p.is_file()]
          assert len(files) <= 400, "diagnostic file budget exceeded"
          assert sum(p.stat().st_size for p in files) <= 64 * 1024 * 1024, "diagnostic byte budget exceeded"
          for p in files:
              p.read_text(encoding="utf-8")
          PY
      - name: Upload bounded text repin evidence
        if: ${{ always() && steps.repin-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-repin-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: repin-proof/
          if-no-files-found: error
          retention-days: 7

  operation-origins:
    if: inputs.platform == 'linux-x64'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      BUN_BUILD_CACHE_DIR: ${{ github.workspace }}/.cache/openclaw-build
      PUPPETEER_SKIP_DOWNLOAD: "1"
      WEBKIT_SOURCE_SHA: ${{ inputs.webkit_source_sha }}
      EXPECTED_NATIVE_SHA: d1e8ee9e11c1ae75a8c6f5f95f28e7476627f13d
    steps:
      - name: Validate source-pair request
        working-directory: .
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          test "$PLATFORM" = linux-x64
          [[ "$WEBKIT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d1e8ee9e11c1ae75a8c6f5f95f28e7476627f13d
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.webkit_source_sha != ''
        with:
          repository: openclaw/WebKit
          ref: ${{ inputs.webkit_source_sha }}
          path: source/.openclaw-webkit
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/LayoutTests/
            !/JSTests/
            !/PerformanceTests/
            !/Websites/
            !/ManualTests/
            !/WebDriverTests/
      - name: Record source-pair identity
        if: inputs.webkit_source_sha != ''
        run: |
          test "$(git -C .openclaw-webkit rev-parse HEAD)" = "$WEBKIT_SOURCE_SHA"
          test -z "$(git -C .openclaw-webkit status --porcelain)"
          mkdir -p build/openclaw-ci
          python3 -c 'import json,subprocess; from pathlib import Path; rev=lambda *args: subprocess.check_output(["git",*args],text=True).strip(); Path("build/openclaw-ci/engine-source.json").write_text(json.dumps({"mode":"source", "bun":{"sha":rev("rev-parse","HEAD"),"tree":rev("rev-parse","HEAD^{tree}")},"webkit":{"repository":"openclaw/WebKit","sha":rev("-C",".openclaw-webkit","rev-parse","HEAD"),"tree":rev("-C",".openclaw-webkit","rev-parse","HEAD^{tree}")},"shippingArchiveQualified":False},indent=2)+"\n")'
          echo "BUN_WEBKIT_PATH=$GITHUB_WORKSPACE/source/.openclaw-webkit" >> "$GITHUB_ENV"
          echo 'Temporary operation-origin diagnosis only; this does not qualify shipping or the full suite.' >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.4"
      - name: Read toolchain pins
        id: pins
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          bun -e 'import { locations, pins } from "./scripts/build/ci-images/spec.ts"; console.log(`llvm-directory=${locations.llvm}\nnode=${pins.nodejs.version}\nrust=${pins.rust.channel}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install native build tools
        timeout-minutes: 15
        env:
          LLVM_DIRECTORY: ${{ steps.pins.outputs.llvm-directory }}
          RUST_TOOLCHAIN: ${{ steps.pins.outputs.rust }}
        run: |
          bash scripts/openclaw-ci/install-linux-toolchain.sh
          if test -n "$WEBKIT_SOURCE_SHA"; then
            sudo apt-get install -y --no-install-recommends libicu-dev pkg-config ruby perl
            # Trimming reads ICU data from the executable, so use its static input contract.
            icu_root="$RUNNER_TEMP/source-pair-icu"
            icu_include=$(pkg-config --variable=includedir icu-uc)
            icu_lib=$(pkg-config --variable=libdir icu-uc)
            test -s "$icu_include/unicode/utypes.h"
            for library in libicui18n.a libicuuc.a libicudata.a; do test -s "$icu_lib/$library"; done
            mkdir -p "$icu_root"
            ln -s "$icu_include" "$icu_root/include"
            ln -s "$icu_lib" "$icu_root/lib"
            echo "BUN_ICU_ROOT=$icu_root" >> "$GITHUB_ENV"
            echo "Source-pair ICU: $(pkg-config --modversion icu-uc), static system archives." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify the matched static ICU input
        run: |
          mkdir -p build/openclaw-ci/aot-baseline
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["BUN_ICU_ROOT"])
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={"version":subprocess.check_output(["pkg-config","--modversion","icu-uc"],text=True).strip(),
                   "archives":{name:digest(root/"lib"/name) for name in ("libicui18n.a","libicuuc.a","libicudata.a")},
                   "headers":{p.name:digest(p) for p in sorted((root/"include/unicode").glob("*.h"))}}
          checksum=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          receipt.update(referenceSHA256="119094f556f6bb38db24f3ec0665778f5bddea27d94b4500b2cf87f0e1e0a515",actualSHA256=checksum,referenceMatch=checksum=="119094f556f6bb38db24f3ec0665778f5bddea27d94b4500b2cf87f0e1e0a515")
          Path("build/openclaw-ci/aot-baseline/icu.json").write_text(json.dumps(receipt,indent=2)+"\n")
          assert receipt["referenceMatch"],"static ICU input differs from matched stock control"
          PY
      - name: Restore build caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/openclaw-build
            build/release/rust-target
            ~/.cargo/registry
            ~/.cargo/git
          key: openclaw-native-x64-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'bun.lock', 'test/bun.lock', 'rust-toolchain.toml', 'scripts/build/**', 'scripts/build.ts', '.github/workflows/openclaw-build-test.yml') }}-${{ steps.pins.outputs.tree }}-${{ inputs.webkit_source_sha || 'pinned' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openclaw-native-x64-v1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'bun.lock', 'test/bun.lock', 'rust-toolchain.toml', 'scripts/build/**', 'scripts/build.ts', '.github/workflows/openclaw-build-test.yml') }}-${{ steps.pins.outputs.tree }}-${{ inputs.webkit_source_sha || 'pinned' }}-
      - name: Install frozen source dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_NATIVE_SHA"
          bun install --frozen-lockfile
      - name: Build the frozen source with the diagnostic engine
        timeout-minutes: 75
        run: |
          unset BUILDKITE_COMMIT GIT_SHA
          export GITHUB_SHA="$EXPECTED_NATIVE_SHA"
          mkdir -p build/openclaw-ci/aot-baseline
          bun -e '
            import { configOf } from "./scripts/build/configure.ts";
            const { cfg } = configOf({ profile: "openclaw-native", overrides: { webkit: "local", webkitVersion: process.env.WEBKIT_SOURCE_SHA } });
            const { buildType, ci, lto, trimmable, webkit, webkitVersion, revision, cc, ld, rustToolchain } = cfg;
            if (buildType !== "Release" || !ci || !lto || !trimmable || webkit !== "local" ||
                revision !== process.env.EXPECTED_NATIVE_SHA || webkitVersion !== process.env.WEBKIT_SOURCE_SHA)
              throw new Error("Unexpected diagnostic build configuration");
            console.log(JSON.stringify({ buildType, ci, lto, trimmable, webkit, webkitVersion, revision, cc, ld, rustToolchain }));
          ' > build/openclaw-ci/aot-baseline/probe-build.json
          bun scripts/build.ts --profile=openclaw-native --webkit=local --webkit-version="$WEBKIT_SOURCE_SHA" --timings -k0
          mkdir -p build/release/bun.trim
          cp build/release/bun-profile.trim/*.txt build/release/bun.trim/
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .openclaw-webkit status --porcelain --untracked-files=no)"
      - name: Trace exact class parameter guard probes
        run: python3 ../scripts/openclaw-ci/node-types-guard-diagnostic.py
      - name: Bound diagnostic report artifacts
        id: report-budget
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path("build/openclaw-ci")
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix in {".json", ".log"}]
          timing = Path("build/release/timings.html")
          if timing.is_file():
              files.append(timing)
          assert len(files) <= 100, "diagnostic report file budget exceeded"
          assert sum(p.stat().st_size for p in files) <= 64 * 1024 * 1024, "diagnostic report byte budget exceeded"
          PYTHON
      - name: Upload diagnostic receipts and operation traces
        if: ${{ always() && steps.report-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aot-operation-origins-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            source/build/openclaw-ci/*.json
            source/build/openclaw-ci/aot-baseline/*.json
            source/build/openclaw-ci/aot-baseline/*.log
            source/build/openclaw-ci/trim-diagnostics/*.json
            source/build/openclaw-ci/trim-diagnostics/*.log
            source/build/release/timings.html
          if-no-files-found: error
          retention-days: 7

  cluster-drain-regression:
    if: inputs.platform == 'darwin-cluster-regression'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Validate the pinned artifact request
        env:
          FIXED_ARTIFACT: ${{ inputs.cluster_fixed_artifact }}
        run: '[[ "$FIXED_ARTIFACT" =~ ^[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9c4e2b1f426f7e938c18ed2a7ace5d17d68c55fa
          path: source
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.4"
      - name: Install the frozen regression harness dependencies
        working-directory: source
        run: bun install --frozen-lockfile
      - name: Download the admitted pre-fix native bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "14168969043"
          run-id: "43731013867"
          repository: openclaw/bun
          github-token: ${{ github.token }}
          path: baseline-bundle
      - name: Download the repaired native bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.cluster_fixed_artifact }}
          run-id: "43739822593"
          repository: openclaw/bun
          github-token: ${{ github.token }}
          path: fixed-bundle
      - name: Verify and unpack both admitted bundles
        run: |
          test "$(uname -m)" = arm64
          test "$(cat baseline-bundle/commit.txt)" = 55284cc25ad430f9bbc46a4923ea120dd4dea637
          test "$(cat fixed-bundle/commit.txt)" = fe6297f8aeb9fb8f9ef1d55a49d054528c68f90c
          for kind in baseline fixed; do
            (cd "$kind-bundle" && shasum -a 256 -c SHA256SUMS)
            mkdir "$kind"
            tar -xzf "$kind-bundle/bun-darwin-arm64.tar.gz" -C "$kind"
          done
      - name: Run the exact committed regression cases on both binaries
        env:
          FIXED_ARTIFACT: ${{ inputs.cluster_fixed_artifact }}
        run: python3 scripts/openclaw-ci/cluster-drain-regression.py --baseline baseline/bun --fixed fixed/bun --source source --out proof --fixed-artifact "$FIXED_ARTIFACT"
      - name: Upload only the bounded text regression proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cluster-drain-regression-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: proof/report.json
          if-no-files-found: error
          retention-days: 7

  cluster-pipe-exit:
    if: inputs.platform == 'darwin-arm64'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a75d9fc1e8132c88c525f32fbc9a1da6767206bc
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: test/js/node/cluster.test.ts
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.4"
      - name: Download the existing admitted native bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: "14168969043"
          run-id: "43731013867"
          repository: openclaw/bun
          github-token: ${{ github.token }}
          path: bundle
      - name: Verify and unpack the native bundle
        run: |
          test "$(uname -m)" = arm64
          test "$(cat bundle/commit.txt)" = 55284cc25ad430f9bbc46a4923ea120dd4dea637
          (cd bundle && shasum -a 256 -c SHA256SUMS)
          mkdir native
          tar -xzf bundle/bun-darwin-arm64.tar.gz -C native
      - name: Capture unchanged cluster fixture exits and inherited stderr
        run: python3 scripts/openclaw-ci/cluster-pipe-exit-diagnostic.py --native native/bun --stock "$(command -v bun)" --source source --out proof
      - name: Upload only the bounded text diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cluster-pipe-exit-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: proof/report.json
          if-no-files-found: error
          retention-days: 7

          env -i PATH="$PATH" HOME="$controller_home" TMPDIR="$controller_tmp" LANG=en_US.UTF-8 CI=true \
            RUNNER_ENVIRONMENT="$HOSTED_ENVIRONMENT" RUNNER_TRACKING_ID="${RUNNER_TRACKING_ID:?}" \
            SDKROOT="${SDKROOT:-}" TOOLCHAINS="${TOOLCHAINS:-}" \
            DYLD_FRAMEWORK_PATH="${DYLD_FRAMEWORK_PATH:-}" DYLD_LIBRARY_PATH="${DYLD_LIBRARY_PATH:-}" \
            python3 scripts/openclaw-ci/openclaw-app-host.py --source source --out app-host-proof \
            --controller-sha "$CONTROLLER_SHA"
      - name: Check bounded text-only app-host evidence
        id: app-host-budget
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("app-host-proof")
          assert (root / "report.json").is_file(), "missing app-host receipt"
          files = list(root.iterdir())
          assert len(files) <= 20 and all(p.is_file() and not p.is_symlink() and p.suffix in {".json", ".jsonl", ".log"} for p in files)
          assert sum(p.stat().st_size for p in files) <= 64 * 1024 * 1024
          for p in files:
              p.read_text(encoding="utf-8")
          PY
      - name: Upload only text app-host evidence
        if: ${{ always() && steps.app-host-budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclaw-app-host-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: app-host-proof/
          if-no-files-found: error
          retention-days: 7

  openclaw-linux-repin:
    if: inputs.platform == 'linux-openclaw-repin'

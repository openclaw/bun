name: OpenClaw TLS Darwin physical config inspection

on:
  pull_request:
    paths:
      - .github/workflows/openclaw-tls-darwin-disassembly.yml
      - .github/openclaw/tls-darwin-disassembly.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: openclaw-tls-darwin-disassembly-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controls
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/openclaw
            .github/workflows
      - name: Install static LLVM tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends --no-install-suggests llvm-23
      - name: Download the exact consumed signed Darwin artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/tls-darwin-input"
          mkdir "$input"
          gh api repos/openclaw/bun/actions/runs/41238111110 > "$input/run.json"
          gh api repos/openclaw/bun/actions/artifacts/13057470428 > "$input/metadata.json"
          curl --location --fail --silent --show-error --proto '=https' --proto-redir '=https' \
            --max-time 300 --max-filesize 232201333 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/openclaw/bun/actions/artifacts/13057470428/zip \
            --output "$input/artifact.zip"
      - name: Capture bounded functions without launching Bun
        shell: bash
        run: |
          set -euo pipefail
          mkdir tls-darwin-disassembly
          cp controls/.github/workflows/openclaw-tls-darwin-disassembly.yml tls-darwin-disassembly/workflow.yml
          cp controls/.github/openclaw/tls-darwin-disassembly.py tls-darwin-disassembly/controller.py
          cp controls/.github/openclaw/tls-darwin-capability.py tls-darwin-disassembly/archive.py
          python3 controls/.github/openclaw/tls-darwin-disassembly.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tls-darwin-disassembly
          path: tls-darwin-disassembly/
          if-no-files-found: error
          retention-days: 7
